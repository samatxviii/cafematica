<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142c29">
<title>Fila do Café — Sala de Aula</title>
<style>
  :root{--cream:#f8f0db;--deep:#152c29;--leaf:#235447;--gold:#edbf69;--copper:#be794a;--muted:#c7d5c8}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(ellipse 80% 75% at 50% 7%,#376154 0%,#1b3433 46%,#0b171a 100%);color:var(--cream);font-family:ui-rounded,"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:clamp(10px,2vw,25px)}
  main{width:min(100%,1210px)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:5px 6px 16px}
  .brand small{display:block;color:#e7c78a;letter-spacing:.27em;font-weight:900;font-size:clamp(.55rem,.9vw,.71rem);margin-bottom:4px}
  .brand h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.035em;font-size:clamp(1.6rem,3vw,2.6rem);margin:0;line-height:1.03;color:#fff5db;text-shadow:0 2px 12px #0003}
  .right{display:flex;align-items:center;gap:9px}
  .stat{min-width:100px;text-align:center;padding:8px 15px;border:1px solid #f8eac128;border-radius:12px;background:#0d2525af;box-shadow:inset 0 1px 0 #fff2}
  .stat span{display:block;font-size:.65rem;font-weight:900;letter-spacing:.16em;color:#c7d6c9}
  .stat b{display:block;font-family:Georgia,serif;font-size:1.52rem;color:#fff1cb;line-height:1.2;font-variant-numeric:tabular-nums}
  #soundBtn{height:55px;width:55px;border:1px solid #f8eac128;border-radius:12px;background:#0d2525c9;color:#f9edd2;font-size:1.3rem;cursor:pointer;transition:background .15s}
  #soundBtn:hover,#soundBtn:focus-visible{background:#306051;outline:2px solid var(--gold);outline-offset:2px}
  .stage{position:relative;overflow:hidden;aspect-ratio:1280/800;border:3px solid #947753;border-radius:20px;background:#4a5441;box-shadow:0 21px 80px #0009,0 3px 0 #f5cf8b36,inset 0 0 0 1px #ffffff22;touch-action:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  .plaque{position:absolute;left:22px;top:17px;display:flex;align-items:center;gap:8px;color:#f4e6c6;font-weight:950;font-size:clamp(.48rem,.85vw,.68rem);letter-spacing:.15em;text-shadow:0 2px 7px #142c29;pointer-events:none}
  .plaque::before{content:"";height:7px;width:7px;border-radius:50%;background:#f8d17b;box-shadow:0 0 8px #ffe196}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b231c80;backdrop-filter:blur(3px);opacity:1;transition:opacity .2s}
  .overlay.hidden{opacity:0;pointer-events:none}
  .dialog{position:relative;text-align:center;max-width:min(90%,580px);padding:28px clamp(22px,4.5vw,60px) 32px;border-radius:18px;border:7px solid #9a643c;outline:2px solid #e7b96c;background:linear-gradient(130deg,#2d5745,#193b32);box-shadow:0 14px 0 #4f3325,0 35px 85px #0008,inset 0 0 0 1px #fff3}
  .dialog::before{content:"";position:absolute;left:12px;top:12px;right:12px;bottom:12px;border:1px solid #f3e2ad21;pointer-events:none;border-radius:5px}
  .cup{font-size:clamp(1.8rem,4vw,3rem);margin:0 0 8px;filter:drop-shadow(0 4px 2px #0005)}
  h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,5.1vw,4.3rem);line-height:1.02;margin:0 0 12px;letter-spacing:-.04em;color:#ffefcb;text-shadow:0 4px 0 #12372f}
  #result{margin:3px 0 19px;color:#f2d9a3;font-weight:800;font-size:clamp(.95rem,2vw,1.2rem)}
  #result:empty{display:none}
  #playBtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:180px;min-height:51px;border-radius:9px;padding:11px 24px;border:0;background:#edc476;color:#3a2e1e;box-shadow:0 5px 0 #b57e39;font:inherit;font-size:1.05rem;font-weight:1000;cursor:pointer;transition:transform .15s,background .15s}
  #playBtn:hover{transform:translateY(-2px);background:#ffdc93}
  #playBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #b57e39}
  #playBtn:focus-visible{outline:3px solid white;outline-offset:4px}
  @media(max-width:650px){.top{padding-bottom:10px;gap:6px}.right{gap:4px}.brand small{letter-spacing:.10em}.stat{min-width:52px;padding:5px 6px;border-radius:8px}.stat span{font-size:.46rem;letter-spacing:.04em}.stat b{font-size:1rem}#soundBtn{width:34px;height:35px;font-size:1rem;border-radius:7px}.stage{border-radius:10px}.plaque{left:9px;top:7px}.dialog{border-width:4px;padding:12px 18px 19px}.cup{margin-bottom:0}#playBtn{min-width:115px;min-height:34px;font-size:.79rem;padding:7px 12px}#result{margin:0 0 8px}}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand"><small>CAFEMÁTICA · JOGO DA COBRINHA</small><h1>Fila do Café <span aria-hidden="true">☕</span></h1></div>
    <div class="right">
      <div class="stat"><span>CAFÉS</span><b id="score">0</b></div>
      <div class="stat"><span>NA FILA</span><b id="teachers">3</b></div>
      <div class="stat"><span>RECORDE</span><b id="best">0</b></div>
      <button id="soundBtn" aria-label="Desligar som" title="Som" type="button">🔊</button>
    </div>
  </header>
  <section class="stage" id="stage" aria-label="Jogo da fila de professores e copos de café em uma sala de aula">
    <canvas id="game" width="1280" height="800"></canvas>
    <div class="plaque">SALA 01 • VISÃO AÉREA</div>
    <div class="overlay" id="overlay">
      <div class="dialog">
        <div class="cup" aria-hidden="true">☕</div>
        <h2 id="message">Hora do café!</h2>
        <p id="result"></p>
        <button id="playBtn" type="button">▶ Começar</button>
      </div>
    </div>
  </section>
</main>
<script>
(() => {
  'use strict';
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
  const W=1280,H=800,COLS=22,ROWS=13;
  const overlay=document.getElementById('overlay'),message=document.getElementById('message');
  const result=document.getElementById('result'),playBtn=document.getElementById('playBtn');
  const scoreEl=document.getElementById('score'),teacherEl=document.getElementById('teachers');
  const bestEl=document.getElementById('best'),soundBtn=document.getElementById('soundBtn');
  const stage=document.getElementById('stage');
  const KEY='cafematica-fila-do-cafe-recorde';
  const DIR={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  const profiles=[
    {shirt:'#c55543',pants:'#283f54',skin:'#e6a879',hair:'#452a28',type:0,glasses:1},
    {shirt:'#297f80',pants:'#3e3944',skin:'#bd7959',hair:'#202227',type:1,glasses:0},
    {shirt:'#d09d43',pants:'#273c4d',skin:'#f1c49f',hair:'#70482e',type:2,glasses:1},
    {shirt:'#7d5ca2',pants:'#314d49',skin:'#94654b',hair:'#232027',type:1,glasses:0},
    {shirt:'#5c89ac',pants:'#433b43',skin:'#d79674',hair:'#4b3030',type:0,glasses:0},
    {shirt:'#b66578',pants:'#264955',skin:'#c18b68',hair:'#302421',type:2,glasses:1},
    {shirt:'#568c5f',pants:'#394c63',skin:'#f0bf8d',hair:'#65412c',type:1,glasses:1},
    {shirt:'#db8651',pants:'#414448',skin:'#9b6948',hair:'#171a19',type:0,glasses:0}
  ];
  let best=0;try{best=Math.max(0,Number(localStorage.getItem(KEY))||0)}catch(_){}
  bestEl.textContent=best;
  let snake,previousSnake,dir,nextDir,food,score=0,tickMs=167,lastTick=0,state='ready',hasTurned=false, muted=false,audio;
  let toast=[],touchStart=null,flash=0;
  const background=document.createElement('canvas');background.width=W;background.height=H;
  const bg=background.getContext('2d');
  function fillPoly(g,pts,color){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fillStyle=color;g.fill();}
  function polyPath(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath()}
  function rr(g,x,y,w,h,r,color){g.beginPath();g.roundRect(x,y,w,h,r);if(color){g.fillStyle=color;g.fill()}}
  function ellipse(g,x,y,rx,ry,color){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(color){g.fillStyle=color;g.fill()}}
  function linear(g,x1,y1,x2,y2,stops){let v=g.createLinearGradient(x1,y1,x2,y2);for(const [t,c] of stops)v.addColorStop(t,c);return v}
  function roomXY(u,v){return {x:(217-41*v)+(1063+41*v-(217-41*v))*u,y:230+476*v};}
  function center(x,y){return roomXY((x+.5)/COLS,(y+.5)/ROWS)}
  function cellWidth(y){return (1063+41*(y+.5)/ROWS-(217-41*(y+.5)/ROWS))/COLS}
  function randSeed(seed){return ()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
  const rnd=randSeed(9307);

  // Cenário estático: tudo é projetado e desenhado em um único Canvas 2D.
  function buildRoom(g){
    g.fillStyle='#0d2525';g.fillRect(0,0,W,H);
    g.fillStyle=linear(g,0,0,0,H,[[0,'#3b655d'],[.29,'#1b3d38'],[1,'#102523']]);g.fillRect(0,0,W,H);
    // Parede do fundo e madeira trabalhada.
    fillPoly(g,[[72,69],[1208,69],[1158,236],[122,236]],linear(g,0,69,0,236,[[0,'#f3d9ab'],[.67,'#d9b88e'],[1,'#ac7958']]));
    for(let x=130;x<1160;x+=45){g.strokeStyle='#764f3830';g.lineWidth=2;g.beginPath();g.moveTo(x,69);g.lineTo(x-12,225);g.stroke();}
    // Parede lateral e rodapés com altura visível.
    fillPoly(g,[[72,69],[122,236],[164,741],[42,714]],'#8a6550');
    fillPoly(g,[[1208,69],[1158,236],[1116,741],[1238,714]],'#8a6550');
    fillPoly(g,[[91,153],[127,235],[164,741],[91,700]],'#bd9171');
    fillPoly(g,[[1189,153],[1153,235],[1116,741],[1189,700]],'#bd9171');
    // Moldura superior e relógio.
    rr(g,553,63,174,23,6,'#976743');rr(g,558,66,164,16,4,'#e8c48a');
    ellipse(g,1079,111,33,33,'#865631');ellipse(g,1079,111,27,27,'#fcf0d4');
    g.strokeStyle='#6f5340';g.lineWidth=3;g.beginPath();g.moveTo(1079,111);g.lineTo(1079,91);g.moveTo(1079,111);g.lineTo(1092,116);g.stroke();
    ellipse(g,1079,111,3.5,3.5,'#6f5340');
    // Quadro-negro central.
    g.save();g.shadowColor='#33201a6e';g.shadowBlur=15;g.shadowOffsetY=8;
    rr(g,338,84,600,147,8,'#8d5a33');g.restore();
    rr(g,347,93,582,129,3,linear(g,349,95,929,222,[[0,'#275a4c'],[1,'#204337']]));
    g.strokeStyle='#fff5cd1b';g.lineWidth=3;g.strokeRect(354,101,568,114);
    g.fillStyle='#f7e9b8';g.font='bold 34px Georgia,serif';g.textAlign='center';g.fillText('SALA DE AULA',638,150);
    g.fillStyle='#d6e1c3b8';g.font='italic 17px Georgia,serif';g.fillText('☕  café + ideias = boas aulas  ☕',638,183);
    g.strokeStyle='#f1f0d16b';g.lineWidth=2;g.beginPath();g.arc(393,157,18,0,Math.PI*2);g.stroke();
    g.font='bold 30px Georgia,serif';g.textAlign='center';g.fillStyle='#e6e8c9';g.fillText('π',393,169);g.fillText('√',883,165);
    rr(g,329,222,618,9,3,'#6d432b');rr(g,361,222,75,5,2,'#f7f0d2');rr(g,836,222,58,5,2,'#e2c288');
    // Duas janelas com paisagem, fora do quadro.
    drawWindow(g,155,92,149,127);drawWindow(g,973,92,71,127);
    // Assoalho em perspectiva com tábuas alternadas.
    const floor=linear(g,0,215,0,749,[[0,'#c99d70'],[.43,'#d9b083'],[1,'#e5bd8e']]);
    fillPoly(g,[[122,230],[1158,230],[1116,742],[164,742]],floor);
    g.save();polyPath(g,[[122,230],[1158,230],[1116,742],[164,742]]);g.clip();
    for(let y=224;y<745;y+=48){
      for(let x=105;x<1180;x+=112){
        g.fillStyle=((Math.floor(x/112)+Math.floor(y/48))%2===0)?'#fff5d30c':'#5d37150a';g.fillRect(x,y,108,46);
      }
      g.strokeStyle='#83563d2f';g.lineWidth=1.4;g.beginPath();g.moveTo(90,y);g.lineTo(1190,y);g.stroke();
    }
    for(let x=125;x<1175;x+=111){g.strokeStyle='#79593b24';g.beginPath();g.moveTo(x,225);g.lineTo(x,744);g.stroke()}
    // Mancha de luz solar no assoalho.
    fillPoly(g,[[153,241],[321,241],[490,730],[252,730]],'#fff5bb18');
    g.restore();
    // Área de jogo demarcada por rodapé baixo (é aqui que a colisão de parede ocorre).
    const p0=roomXY(0,0),p1=roomXY(1,0),p2=roomXY(1,1),p3=roomXY(0,1);
    fillPoly(g,[[p0.x,p0.y+7],[p1.x,p1.y+7],[p2.x,p2.y+9],[p3.x,p3.y+9]],'#724f36');
    fillPoly(g,[[p0.x,p0.y],[p1.x,p1.y],[p2.x,p2.y],[p3.x,p3.y]],'#e6c498');
    // Piso de ladrilhos claros; padrão muito sutil para boa leitura.
    g.save();polyPath(g,[[p0.x,p0.y],[p1.x,p1.y],[p2.x,p2.y],[p3.x,p3.y]]);g.clip();
    for(let row=0;row<ROWS;row++)for(let col=0;col<COLS;col++){
      const a=roomXY(col/COLS,row/ROWS),b=roomXY((col+1)/COLS,row/ROWS);
      const c=roomXY((col+1)/COLS,(row+1)/ROWS),d=roomXY(col/COLS,(row+1)/ROWS);
      fillPoly(g,[[a.x,a.y],[b.x,b.y],[c.x,c.y],[d.x,d.y]],(row+col)%2?'#ae704014':'#fff9eb0d');
    }
    for(let r=0;r<=ROWS;r++){
      let a=roomXY(0,r/ROWS),b=roomXY(1,r/ROWS);g.strokeStyle='#946a4221';g.lineWidth=1;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
    }
    for(let c=0;c<=COLS;c++){
      let a=roomXY(c/COLS,0),b=roomXY(c/COLS,1);g.strokeStyle='#946a421a';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
    }
    g.restore();
    g.strokeStyle='#fdf1d6';g.lineWidth=5;polyPath(g,[[p0.x,p0.y],[p1.x,p1.y],[p2.x,p2.y],[p3.x,p3.y]]);g.stroke();
    g.strokeStyle='#89613c';g.lineWidth=7;g.beginPath();g.moveTo(p0.x,p0.y);g.lineTo(p3.x,p3.y);g.lineTo(p2.x,p2.y);g.lineTo(p1.x,p1.y);g.stroke();
    // Carteiras dos alunos nas laterais (fora da área livre de movimento).
    for(const y of [304,450,594]){
      drawDesk(g,108,y,'left');drawDesk(g,1139,y,'right');
    }
    drawPottedPlant(g,162,727,1);drawPottedPlant(g,1121,727,.9);
    // Porta e maçaneta na parede direita.
    fillPoly(g,[[1193,481],[1219,491],[1219,678],[1193,663]],'#553d31');
    fillPoly(g,[[1197,492],[1214,498],[1214,663],[1197,655]],'#aa774c');
    ellipse(g,1205,589,3,4,'#f4d595');
    // Pequenas placas pedagógicas.
    rr(g,206,100,92,40,3,'#d2a370');g.fillStyle='#573c2b';g.textAlign='center';g.font='bold 17px Georgia';g.fillText('2 + 2 = 4',252,125);
  }
  function drawWindow(g,x,y,w,h){
    rr(g,x-6,y-6,w+12,h+12,4,'#93613c');rr(g,x,y,w,h,2,'#d9e6df');
    rr(g,x+5,y+5,w-10,h-10,1,linear(g,0,y,0,y+h,[[0,'#7fb9c7'],[1,'#c7dfbc']]));
    g.fillStyle='#a2caa6';g.beginPath();g.moveTo(x+5,y+h*.65);g.quadraticCurveTo(x+w*.4,y+h*.24,x+w*.6,y+h*.62);g.quadraticCurveTo(x+w*.87,y+h*.38,x+w-5,y+h*.60);g.lineTo(x+w-5,y+h-5);g.lineTo(x+5,y+h-5);g.fill();
    g.fillStyle='#688c79';ellipse(g,x+w*.32,y+h*.70,w*.17,h*.20);ellipse(g,x+w*.72,y+h*.68,w*.16,h*.22);
    rr(g,x+w/2-4,y,8,h,1,'#eee0bd');rr(g,x,y+h/2-4,w,8,1,'#eee0bd');
    g.strokeStyle='#fff9d69a';g.lineWidth=2;g.strokeRect(x+3,y+3,w-6,h-6);
  }
  function drawDesk(g,x,y,side){
    g.save();g.translate(x,y);if(side==='right')g.scale(-1,1);
    ellipse(g,14,28,45,13,'#412f2860');
    rr(g,-25,19,75,17,4,'#66513f');rr(g,-31,0,76,26,5,'#8b5d3b');
    rr(g,-33,-3,80,25,4,linear(g,-20,-3,48,25,[[0,'#e1ae6d'],[1,'#b97d49']]));
    g.fillStyle='#f2d19f';g.fillRect(-19,3,24,16);g.strokeStyle='#caa164';g.strokeRect(-19,3,24,16);
    g.fillStyle='#f8f1d9';g.fillRect(-18,5,22,13);
    rr(g,16,1,8,17,2,'#24655c');rr(g,29,2,6,15,2,'#a83c35');
    rr(g,-13,34,40,5,3,'#684a37');g.restore();
  }
  function drawPottedPlant(g,x,y,s){g.save();g.translate(x,y);g.scale(s,s);
    ellipse(g,0,9,23,9,'#6c472d77');
    for(let a=0;a<8;a++){
      let angle=a*Math.PI/4;g.save();g.rotate(angle);
      ellipse(g,0,-29,9,19,a%2?'#38744c':'#4e9061');g.restore();
    }
    rr(g,-13,-17,26,24,6,'#c16f49');ellipse(g,0,-17,14,6,'#e8a676');
    ellipse(g,0,-17,10,3,'#533f2c');g.restore();}
  buildRoom(bg);

  function soundCtx(){
    if(muted)return null;
    try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});return audio;}catch(_){return null;}
  }
  function tone(f,d,delay=0,kind='sine',gain=.065,to=null){
    const ac=soundCtx();if(!ac)return;const t=ac.currentTime+delay;
    const osc=ac.createOscillator(),env=ac.createGain();osc.type=kind;
    osc.frequency.setValueAtTime(f,t);
    if(to)osc.frequency.exponentialRampToValueAtTime(to,t+d);
    env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(gain,t+.012);env.gain.exponentialRampToValueAtTime(.0001,t+d);
    osc.connect(env);env.connect(ac.destination);osc.start(t);osc.stop(t+d+.03);
  }
  function sound(which){
    if(which==='coffee') {tone(660,.09,0,'sine',.07,790);tone(880,.11,.07,'sine',.07,1180);tone(1240,.2,.15,'triangle',.055,1380)}
    else if(which==='start'){tone(390,.12,0,'triangle',.07,580);tone(550,.12,.10,'triangle',.07,760)}
    else if(which==='over'){tone(540,.2,0,'triangle',.08,310);tone(300,.27,.18,'triangle',.08,125);tone(142,.4,.35,'sine',.045,100)}
    else if(which==='step'){tone(180,.025,0,'sine',.009,170)}
  }
  function reset(){
    snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];previousSnake=snake.map(p=>({...p}));
    dir={x:1,y:0};nextDir=dir;hasTurned=false;food={x:15,y:7};score=0;tickMs=165;
    scoreEl.textContent='0';teacherEl.textContent=snake.length;toast=[];flash=0;
  }
  function placeCoffee(){
    let free=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});
    return free.length?free[Math.floor(Math.random()*free.length)]:null;
  }
  function start(){reset();state='playing';overlay.classList.add('hidden');lastTick=performance.now();sound('start');}
  function gameOver(win=false){
    state='over';message.textContent=win?'Café para todos!':'Fim da aula!';
    result.textContent=`${score} ${score===1?'café servido':'cafés servidos'} · ${snake.length} professores`;
    playBtn.textContent='↻ Jogar novamente';overlay.classList.remove('hidden');
    sound(win?'coffee':'over');
  }
  function step(){
    previousSnake=snake.map(p=>({...p}));dir=nextDir;hasTurned=false;
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    const eating=food&&head.x===food.x&&head.y===food.y;
    const body=eating?snake:snake.slice(0,-1);
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||body.some(p=>p.x===head.x&&p.y===head.y)){
      flash=10;gameOver();return;
    }
    snake.unshift(head);
    if(eating){
      score++;scoreEl.textContent=score;teacherEl.textContent=snake.length;
      tickMs=Math.max(80,165-score*3);sound('coffee');
      const here=center(head.x,head.y);
      for(let i=0;i<12;i++)toast.push({x:here.x,y:here.y,vx:(Math.random()-.5)*4.2,vy:(Math.random()-.5)*3.4-1,life:1,size:2.5+Math.random()*2.5,color:['#f7ecce','#dfac5d','#66a890','#a65344'][i%4]});
      if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem(KEY,String(best))}catch(_){}}
      food=placeCoffee();if(!food)gameOver(true);
    }else{snake.pop(); if(score%3===1&&Math.random()<.15)sound('step')}
  }
  function input(d){
    if(!d)return;
    if(state==='ready'||state==='over'){start();if(d.x!==-dir.x||d.y!==-dir.y)nextDir=d;return;}
    if(state!=='playing'||hasTurned)return;
    if(d.x===-dir.x&&d.y===-dir.y)return;
    nextDir=d;hasTurned=true;
  }
  document.addEventListener('keydown',e=>{
    const k=e.key.length===1?e.key.toLowerCase():e.key;
    if(DIR[k]){e.preventDefault();input(DIR[k]);}
    else if((k==='Enter'||k===' ')&&state!=='playing'){e.preventDefault();start();}
  });
  playBtn.addEventListener('click',()=>start());
  soundBtn.addEventListener('click',()=>{muted=!muted;soundBtn.textContent=muted?'🔇':'🔊';soundBtn.title=muted?'Ativar som':'Desativar som';soundBtn.setAttribute('aria-label',soundBtn.title);if(!muted)sound('start')});
  stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;touchStart={x:e.clientX,y:e.clientY};});
  stage.addEventListener('pointerup',e=>{
    if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<17)return;
    input(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)});
  });
  stage.addEventListener('pointercancel',()=>touchStart=null);

  // Copo de café: caneca, alça, café, espuma, vapor animado e símbolo π.
  function drawCoffee(g,x,y,t){
    g.save();g.translate(x,y);let bob=Math.sin(t/360)*1.4;g.translate(0,bob);
    ellipse(g,1,13,20,7,'#5d402656');
    ellipse(g,0,8,19,8,'#faf1db');ellipse(g,0,8,14,5,'#cfbd9c');
    g.lineWidth=6;g.strokeStyle='#fef8e8';g.beginPath();g.ellipse(13,2,10,8,-.25,-1.3,1.4);g.stroke();
    g.lineWidth=2.5;g.strokeStyle='#caa985';g.beginPath();g.ellipse(13,2,10,8,-.25,-1.3,1.4);g.stroke();
    rr(g,-14,-7,28,20,6,'#eee6d3');
    fillPoly(g,[[-14,-3],[-12,12],[12,12],[14,-3]],'#f4ebd9');
    ellipse(g,0,-7,14,7,'#fef9ef');ellipse(g,0,-6,10.8,4.5,'#713c24');
    ellipse(g,-1,-7,5.4,1.9,'#b77643');
    g.fillStyle='#3a3b32';g.font='bold 14px Georgia,serif';g.textAlign='center';g.fillText('π',0,9);
    g.strokeStyle='#fff0d2b3';g.lineWidth=2;g.lineCap='round';
    for(let i=0;i<2;i++){let drift=(t/580+i*.6)%1;g.globalAlpha=(1-drift)*.65;g.beginPath();g.moveTo(-6+i*10,-19-drift*15);g.bezierCurveTo(-10+i*10,-24-drift*13,-2+i*10,-27-drift*17,-6+i*10,-33-drift*17);g.stroke();}
    g.restore();
  }
  function interpAt(i,alpha){
    const end=snake[i],from=previousSnake[i]||previousSnake[previousSnake.length-1]||end;
    return {x:from.x+(end.x-from.x)*alpha,y:from.y+(end.y-from.y)*alpha};
  }
  // Cada pedaço da antiga cobrinha virou uma pessoa diferente, com roupa, cabelo, braços e óculos.
  function drawTeacher(g,x,y,index,t,orientation){
    const p=profiles[index%profiles.length];
    const move=Math.sin(t/103+index*1.25)*1.5;
    const s=.88+(y-230)/476*.12;
    g.save();g.translate(x,y);g.scale(s,s);
    ellipse(g,2,17,19,7,'#583a2855');
    // Pernas e sapatos vistos por cima, com ligeiro movimento de passada.
    g.fillStyle=p.pants;rr(g,-10,5,8,14+move,3,p.pants);rr(g,2,5,8,14-move,3,p.pants);
    rr(g,-11,16+move,10,6,3,'#3a302d');rr(g,2,16-move,10,6,3,'#37302e');
    // Braços, mangas e pequena pasta de alguns professores.
    g.save();g.translate(0,Math.sin(t/183+index)*.7);
    rr(g,-19,-4,8,20,4,p.shirt);rr(g,11,-4,8,20,4,p.shirt);
    ellipse(g,-15,14,3.4,4.8,p.skin);ellipse(g,15,14,3.4,4.8,p.skin);
    if(index%4===2){g.save();g.rotate(.12);rr(g,16,8,8,13,2,'#e1ac48');g.strokeStyle='#9b653b';g.lineWidth=1;g.strokeRect(18,11,4,8);g.restore();}
    // Tronco em relevo, gola, gravata ou camisa.
    g.save();g.shadowColor='#25191555';g.shadowBlur=4;g.shadowOffsetY=3;rr(g,-14,-9,28,26,8,p.shirt);g.restore();
    g.fillStyle='#fff5df';g.beginPath();g.moveTo(-6,-8);g.lineTo(0,-2);g.lineTo(6,-8);g.closePath();g.fill();
    if(p.type===0){g.fillStyle='#614339';g.beginPath();g.moveTo(0,-3);g.lineTo(-3,7);g.lineTo(0,12);g.lineTo(3,7);g.closePath();g.fill();}
    if(p.type===1){g.strokeStyle='#f8dfb981';g.lineWidth=2;g.beginPath();g.moveTo(-10,1);g.lineTo(10,1);g.stroke();}
    // Pescoço e cabeça grandes para que cada segmento pareça um professor.
    ellipse(g,0,-10,8,5,p.skin);
    ellipse(g,0,-18,13,13,p.hair);
    ellipse(g,0,-17,10.6,10.5,p.skin);
    if(p.type===1){
      g.fillStyle=p.hair;g.beginPath();g.moveTo(-12,-25);g.quadraticCurveTo(-2,-36,10,-25);g.quadraticCurveTo(13,-20,9,-17);g.lineTo(6,-23);g.quadraticCurveTo(-3,-18,-10,-18);g.closePath();g.fill();
      ellipse(g,-11,-11,4,9,p.hair);ellipse(g,11,-12,4,9,p.hair);
    }else if(p.type===2){
      g.fillStyle=p.hair;g.beginPath();g.ellipse(0,-27,13,6,0,Math.PI,2*Math.PI);g.fill();
      ellipse(g,-9,-24,5,5,p.hair);ellipse(g,10,-25,4,5,p.hair);
    }else{
      g.fillStyle=p.hair;g.beginPath();g.moveTo(-10,-23);g.quadraticCurveTo(-4,-36,8,-29);g.lineTo(11,-22);g.quadraticCurveTo(0,-28,-10,-20);g.closePath();g.fill();
    }
    // Olhos na direção do movimento (a pose continua legível de cima).
    const lookX=(orientation?.x||0)*1.3,lookY=(orientation?.y||0)*.6;
    ellipse(g,-4+lookX,-17+lookY,1.2,1.7,'#2f2927');ellipse(g,4+lookX,-17+lookY,1.2,1.7,'#2f2927');
    if(p.glasses){g.strokeStyle='#333639';g.lineWidth=1.4;g.beginPath();g.ellipse(-4,-17,4.6,3.6,0,0,Math.PI*2);g.ellipse(4,-17,4.6,3.6,0,0,Math.PI*2);g.moveTo(-.5,-17);g.lineTo(.5,-17);g.stroke();}
    g.strokeStyle='#9a5c46';g.lineWidth=1;g.beginPath();g.arc(0,-13,2.2,.12,Math.PI-.12);g.stroke();
    // Destaque do professor que lidera a fila.
    if(index===0){
      g.strokeStyle='#f7de86';g.lineWidth=1.8;g.setLineDash([3,3]);ellipse(g,0,-4,24,30);g.stroke();g.setLineDash([]);
      g.fillStyle='#ffefc1';g.font='bold 12px Georgia';g.textAlign='center';g.fillText('★',0,-38);
    }
    g.restore();g.restore();
  }
  function drawParticles(g){
    for(const q of toast){g.globalAlpha=Math.max(0,q.life);ellipse(g,q.x,q.y,q.size,q.size,q.color);q.x+=q.vx;q.y+=q.vy;q.vy+=.06;q.life-=.025;}
    g.globalAlpha=1;toast=toast.filter(q=>q.life>0);
  }
  function drawFrame(now){
    const active=state==='playing';
    if(active){
      let loop=0;
      while(now-lastTick>=tickMs&&loop++<5){lastTick+=tickMs;step();if(state!=='playing')break;}
      if(loop>=5)lastTick=now;
    }
    const a=state==='playing'?Math.min(1,Math.max(0,(now-lastTick)/tickMs)):1;
    ctx.drawImage(background,0,0);
    // Café coletável.
    if(food){let f=center(food.x,food.y);const halo=ctx.createRadialGradient(f.x,f.y,3,f.x,f.y,38);
      halo.addColorStop(0,'#ffe49f74');halo.addColorStop(1,'#ffe49f00');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(f.x,f.y,38,0,Math.PI*2);ctx.fill();drawCoffee(ctx,f.x,f.y,now);
    }
    const pieces=[];
    for(let i=0;i<snake.length;i++){
      const p=interpAt(i,a),at=roomXY((p.x+.5)/COLS,(p.y+.5)/ROWS);
      const next=snake[i-1]||{x:snake[0].x+dir.x,y:snake[0].y+dir.y};
      const orient=i===0?dir:{x:next.x-snake[i].x,y:next.y-snake[i].y};
      pieces.push({...at,i,orient});
    }
    // Pintura de trás para a frente para respeitar sombras e sobreposições.
    pieces.sort((v,w)=>v.y-w.y);
    for(const p of pieces)drawTeacher(ctx,p.x,p.y,p.i,now,p.orient);
    drawParticles(ctx);
    if(flash>0){ctx.fillStyle=`rgba(235,66,62,${(flash/10)*.16})`;ctx.fillRect(0,0,W,H);flash--;}
    requestAnimationFrame(drawFrame);
  }
  reset();requestAnimationFrame(drawFrame);
})();
</script>
