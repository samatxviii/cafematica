  <script>
    (function () {
      document.title = "📅 Agendar";

      const WHATSAPP_DESTINO = "5567999975834";

      const ASSUNTOS_PREDEFINIDOS = [
        "Aula particular de Matemática",

      ];

      const PAISES_WHATSAPP = [
        { id: "BR", nome: "Brasil", codigo: "55", exemplo: "(67) 99999-9999" },
        { id: "PT", nome: "Portugal", codigo: "351", exemplo: "912 345 678" },
        { id: "US", nome: "Estados Unidos", codigo: "1", exemplo: "555 123 4567" },

        { id: "AR", nome: "Argentina", codigo: "54", exemplo: "9 11 1234-5678" },

        { id: "BO", nome: "Bolívia", codigo: "591", exemplo: "71234567" },
        { id: "PE", nome: "Peru", codigo: "51", exemplo: "912 345 678" },
        { id: "CO", nome: "Colômbia", codigo: "57", exemplo: "300 1234567" },
        { id: "MX", nome: "México", codigo: "52", exemplo: "55 1234 5678" },
        { id: "ES", nome: "Espanha", codigo: "34", exemplo: "612 345 678" },
        { id: "FR", nome: "França", codigo: "33", exemplo: "6 12 34 56 78" },
        { id: "IT", nome: "Itália", codigo: "39", exemplo: "312 345 6789" },
        { id: "DE", nome: "Alemanha", codigo: "49", exemplo: "1512 3456789" },
        { id: "GB", nome: "Reino Unido", codigo: "44", exemplo: "7400 123456" },
        { id: "AO", nome: "Angola", codigo: "244", exemplo: "923 123 456" },
        { id: "MZ", nome: "Moçambique", codigo: "258", exemplo: "84 123 4567" },
        { id: "JP", nome: "Japão", codigo: "81", exemplo: "90 1234 5678" },
        { id: "OUTRO", nome: "Outro país", codigo: "", exemplo: "Digite o código do país e o número" }
      ];

      const HORARIOS_INDISPONIVEIS = {
        // Exemplo:
        // "2026-05-30": ["09:00", "15:00"],
        // "2026-06-01": ["07:00", "08:00", "20:00"]
      };

      const agenda = document.querySelector("[data-agenda-cafematica]");
      if (!agenda) return;

      const elMes = agenda.querySelector("[data-agenda-mes]");
      const elDias = agenda.querySelector("[data-agenda-dias]");
      const btnAnterior = agenda.querySelector("[data-agenda-anterior]");
      const btnProximo = agenda.querySelector("[data-agenda-proximo]");

      const modal = agenda.querySelector("[data-agenda-modal]");
      const modalFechar = agenda.querySelectorAll("[data-agenda-fechar]");
      const elEtapa = agenda.querySelector("[data-agenda-etapa]");
      const elResumo = agenda.querySelector("[data-agenda-resumo]");
      const elAviso = agenda.querySelector("[data-agenda-aviso]");
      const elCorpo = agenda.querySelector("[data-agenda-corpo]");
      const btnVoltar = agenda.querySelector("[data-agenda-voltar]");
      const btnConfirmar = agenda.querySelector("[data-agenda-confirmar]");
      const btnAvancar = agenda.querySelector("[data-agenda-avancar]");
      const bolinhas = agenda.querySelectorAll("[data-agenda-bolinha]");

      const hojeIso = obterHojeBrasiliaIso();
      const [anoHoje, mesHoje] = hojeIso.split("-").map(Number);

      let anoAtual = anoHoje;
      let mesAtual = mesHoje - 1;

      const estado = {
        etapa: 0,
        data: "",
        horario: "",
        assunto: "",
        nome: "",
        paisId: "BR",
        paisCodigo: "55",
        paisCodigoManual: "",
        telefone: ""
      };

      function obterHojeBrasiliaIso() {
        const partes = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Sao_Paulo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());

        const mapa = {};
        partes.forEach((parte) => {
          mapa[parte.type] = parte.value;
        });

        return `${mapa.year}-${mapa.month}-${mapa.day}`;
      }

      function obterPaisSelecionado() {
        return PAISES_WHATSAPP.find((pais) => pais.id === estado.paisId) || PAISES_WHATSAPP[0];
      }

      function obterCodigoPaisEfetivo() {
        if (estado.paisId === "OUTRO") {
          return estado.paisCodigoManual.replace(/\D/g, "");
        }

        return estado.paisCodigo.replace(/\D/g, "");
      }


      function obterHoraAtualBrasilia() {
  const partes = new Intl.DateTimeFormat("pt-BR", {
    timeZone: "America/Sao_Paulo",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).formatToParts(new Date());

  const mapa = {};
  partes.forEach((parte) => {
    mapa[parte.type] = parte.value;
  });

  return {
    hora: Number(mapa.hour),
    minuto: Number(mapa.minute)
  };
}

function hojeAindaPodeSerAgendado() {
  const agora = obterHoraAtualBrasilia();

  return agora.hora < 18;
}

function horarioBloqueadoPelaRegraDoDia(dataIso, horario) {
  if (dataIso !== hojeIso) {
    return false;
  }

  const agora = obterHoraAtualBrasilia();
  const horaEscolhida = Number(horario.split(":")[0]);

  if (agora.hora >= 18) {
    return true;
  }

  if (agora.hora >= 13) {
    return horaEscolhida < 18;
  }

  return horaEscolhida < 13;
}

      function criarIso(ano, mesZero, dia) {
        const mes = String(mesZero + 1).padStart(2, "0");
        const diaFormatado = String(dia).padStart(2, "0");
        return `${ano}-${mes}-${diaFormatado}`;
      }

      function formatarDataBR(iso) {
        const [ano, mes, dia] = iso.split("-");
        return `${dia}/${mes}/${ano}`;
      }

      function nomeDoMes(ano, mesZero) {
        const data = new Date(ano, mesZero, 1, 12);
        return new Intl.DateTimeFormat("pt-BR", {
          month: "long",
          year: "numeric"
        }).format(data);
      }

      function gerarHorarios() {
  const horarios = [];

  for (let hora = 7; hora <= 22; hora++) {
    horarios.push(`${String(hora).padStart(2, "0")}:00`);
  }

  return horarios;
}

      function horarioIndisponivel(dataIso, horario) {
  const indisponivelManual = Boolean(
    HORARIOS_INDISPONIVEIS[dataIso] &&
    HORARIOS_INDISPONIVEIS[dataIso].includes(horario)
  );

  const indisponivelPelaRegraDoDia = horarioBloqueadoPelaRegraDoDia(dataIso, horario);

  return indisponivelManual || indisponivelPelaRegraDoDia;
}

      function renderizarCalendario() {
        elMes.textContent = nomeDoMes(anoAtual, mesAtual);
        elDias.innerHTML = "";

        const primeiroDiaSemana = new Date(anoAtual, mesAtual, 1).getDay();
        const totalDias = new Date(anoAtual, mesAtual + 1, 0).getDate();

        for (let i = 0; i < primeiroDiaSemana; i++) {
          const vazio = document.createElement("span");
          vazio.className = "agenda-dia vazio";
          elDias.appendChild(vazio);
        }

        for (let dia = 1; dia <= totalDias; dia++) {
          const dataIso = criarIso(anoAtual, mesAtual, dia);
          const passado = dataIso < hojeIso || (dataIso === hojeIso && !hojeAindaPodeSerAgendado());

          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-dia";
          botao.textContent = dia;

          if (dataIso === hojeIso) {
            botao.classList.add("hoje");
          }

          if (passado) {
            botao.disabled = true;
            botao.setAttribute("aria-label", `${formatarDataBR(dataIso)} indisponível`);
          } else {
            botao.setAttribute("aria-label", `Agendar em ${formatarDataBR(dataIso)}`);
            botao.addEventListener("click", () => abrirModal(dataIso));
          }

          elDias.appendChild(botao);
        }

        const estaNoMesAtualOuAnterior =
          anoAtual < anoHoje ||
          (anoAtual === anoHoje && mesAtual <= mesHoje - 1);

        btnAnterior.disabled = estaNoMesAtualOuAnterior;
      }

      function abrirModal(dataIso) {
        estado.etapa = 0;
        estado.data = dataIso;
        estado.horario = "";
        estado.assunto = "";
        estado.nome = "";
        estado.paisId = "BR";
        estado.paisCodigo = "55";
        estado.paisCodigoManual = "";
        estado.telefone = "";

        modal.hidden = false;
        document.body.classList.add("agenda-modal-aberto");

        renderizarPopup();
      }

      function fecharModal() {
        modal.hidden = true;
        document.body.classList.remove("agenda-modal-aberto");
      }

      function renderizarPopup() {
        elEtapa.textContent = `Etapa ${estado.etapa + 1} de 3`;
        elResumo.textContent = `Data escolhida: ${formatarDataBR(estado.data)}`;

        bolinhas.forEach((bolinha, indice) => {
          bolinha.classList.toggle("ativo", indice <= estado.etapa);
        });

        elAviso.textContent = "";

        if (estado.etapa === 0) {
          renderizarEtapaHorarios();
        }

        if (estado.etapa === 1) {
          renderizarEtapaAssunto();
        }

        if (estado.etapa === 2) {
          renderizarEtapaDados();
        }

        atualizarBotoes();
      }

      function renderizarEtapaHorarios() {
        const horarios = gerarHorarios();

        elCorpo.innerHTML = `
          <h4>Escolha o horário de início</h4>
          <p>Horários disponíveis das 7h00 às 22h00, pelo horário de Brasília.</p>
          <div class="agenda-grade-horarios"></div>
        `;

        const grade = elCorpo.querySelector(".agenda-grade-horarios");

        horarios.forEach((horario) => {
          const indisponivel = horarioIndisponivel(estado.data, horario);

          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-horario";
          botao.textContent = horario;
          botao.disabled = indisponivel;

          if (estado.horario === horario) {
            botao.classList.add("selecionado");
          }

          if (indisponivel) {
            botao.title = "Este horário está indisponível.";
          } else {
            botao.addEventListener("click", () => {
              estado.horario = horario;
              renderizarPopup();
            });
          }

          grade.appendChild(botao);
        });
      }

      function renderizarEtapaAssunto() {
        elCorpo.innerHTML = `
          <h4>Sobre qual assunto você deseja atendimento?</h4>
          <p>Escolha uma das opções abaixo.</p>
          <div class="agenda-grade-assuntos"></div>
        `;

        const grade = elCorpo.querySelector(".agenda-grade-assuntos");

        ASSUNTOS_PREDEFINIDOS.forEach((assunto) => {
          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-assunto";
          botao.textContent = assunto;

          if (estado.assunto === assunto) {
            botao.classList.add("selecionado");
          }

          botao.addEventListener("click", () => {
            estado.assunto = assunto;
            renderizarPopup();
          });

          grade.appendChild(botao);
        });
      }

      function renderizarEtapaDados() {
        const paisSelecionado = obterPaisSelecionado();
        const usandoPaisManual = estado.paisId === "OUTRO";
        const codigoAtual = obterCodigoPaisEfetivo();
        const exemploTelefone = usandoPaisManual
          ? "Digite apenas o número, sem o código do país"
          : paisSelecionado.exemplo;

        elCorpo.innerHTML = `
          <h4>Informe seus dados</h4>
          <p>Preencha seu nome e seu WhatsApp para finalizar a solicitação.</p>

          <div class="agenda-campos">
            <div class="agenda-campo">
              <label for="agendaNome">Nome</label>
              <input id="agendaNome" type="text" autocomplete="name" placeholder="Seu nome completo">
            </div>

            <div class="agenda-campo">
              <label for="agendaTelefone">WhatsApp</label>

              <div class="agenda-telefone-linha">
                <div class="agenda-pais-wrap">
                  <select id="agendaPais" class="agenda-pais" aria-label="País do WhatsApp">
                    ${PAISES_WHATSAPP.map((pais) => {
                      const texto = pais.codigo
                        ? `${pais.nome} +${pais.codigo}`
                        : pais.nome;

                      return `
                        <option value="${pais.id}" ${pais.id === estado.paisId ? "selected" : ""}>
                          ${texto}
                        </option>
                      `;
                    }).join("")}
                  </select>

                  <input
                    id="agendaCodigoPais"
                    class="agenda-codigo-pais"
                    type="tel"
                    inputmode="numeric"
                    placeholder="Código do país. Ex.: 351"
                    value="${estado.paisCodigoManual}"
                    ${usandoPaisManual ? "" : "hidden"}
                  >
                </div>

                <input id="agendaTelefone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="${exemploTelefone}">
              </div>

              <div class="agenda-ajuda" data-agenda-ajuda-telefone>
                ${usandoPaisManual
                  ? "Escolha ‘Outro país’, informe o código internacional à esquerda e o número à direita."
                  : `Exemplo: +${codigoAtual} ${paisSelecionado.exemplo}`
                }
              </div>
            </div>
          </div>
        `;

        const inputNome = elCorpo.querySelector("#agendaNome");
        const selectPais = elCorpo.querySelector("#agendaPais");
        const inputCodigoPais = elCorpo.querySelector("#agendaCodigoPais");
        const inputTelefone = elCorpo.querySelector("#agendaTelefone");

        inputNome.value = estado.nome;
        inputTelefone.value = estado.telefone;

        inputNome.addEventListener("input", () => {
          estado.nome = inputNome.value;
          atualizarBotoes();
        });

        selectPais.addEventListener("change", () => {
          const novoPais = PAISES_WHATSAPP.find((pais) => pais.id === selectPais.value) || PAISES_WHATSAPP[0];

          estado.paisId = novoPais.id;
          estado.paisCodigo = novoPais.codigo;
          estado.paisCodigoManual = "";
          estado.telefone = "";

          renderizarPopup();
        });

        inputCodigoPais.addEventListener("input", () => {
          inputCodigoPais.value = inputCodigoPais.value.replace(/\D/g, "").slice(0, 4);
          estado.paisCodigoManual = inputCodigoPais.value;
          atualizarBotoes();
        });

        inputTelefone.addEventListener("input", () => {
          if (obterCodigoPaisEfetivo() === "55") {
            inputTelefone.value = mascararTelefone(inputTelefone.value);
          }

          estado.telefone = inputTelefone.value;
          atualizarBotoes();
        });

        inputNome.focus();
      }

      function mascararTelefone(valor) {
        const numeros = valor.replace(/\D/g, "").slice(0, 11);

        if (numeros.length <= 2) {
          return numeros;
        }

        if (numeros.length <= 6) {
          return `(${numeros.slice(0, 2)}) ${numeros.slice(2)}`;
        }

        if (numeros.length <= 10) {
          return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 6)}-${numeros.slice(6)}`;
        }

        return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 7)}-${numeros.slice(7)}`;
      }

      function telefoneValido(valor) {
        const codigoPais = obterCodigoPaisEfetivo();
        const numero = valor.replace(/\D/g, "");

        if (!codigoPais || codigoPais.length < 1 || codigoPais.length > 4) {
          return false;
        }

        if (numero.length < 6 || numero.length > 15) {
          return false;
        }

        if (/^(\d)\1+$/.test(numero)) {
          return false;
        }

        if (codigoPais === "55") {
          if (!/^[1-9]{2}\d{8,9}$/.test(numero)) {
            return false;
          }

          const ddd = Number(numero.slice(0, 2));

          if (ddd < 11 || ddd > 99) {
            return false;
          }

          if (numero.length === 11 && numero[2] !== "9") {
            return false;
          }
        }

        return true;
      }

      function podeAvancar() {
        if (estado.etapa === 0) {
          return Boolean(estado.horario);
        }

        if (estado.etapa === 1) {
          return Boolean(estado.assunto);
        }

        return false;
      }

      function podeConfirmar() {
        const nomeOk = estado.nome.trim().length >= 2;
        const telefoneOk = telefoneValido(estado.telefone);

        const dadosBasicosOk = Boolean(
          estado.data &&
          estado.horario &&
          estado.assunto &&
          nomeOk &&
          telefoneOk
        );

        const indisponivel = horarioIndisponivel(estado.data, estado.horario);

        if (estado.etapa === 2 && indisponivel) {
          elAviso.textContent = "Este horário está indisponível.";
        } else {
          elAviso.textContent = "";
        }

        return dadosBasicosOk && !indisponivel;
      }

      function atualizarBotoes() {
        btnVoltar.disabled = estado.etapa === 0;
        btnAvancar.disabled = estado.etapa === 2 || !podeAvancar();
        btnConfirmar.disabled = !podeConfirmar();
      }

      function enviarWhatsApp() {
        if (!podeConfirmar()) return;

        const codigoPais = obterCodigoPaisEfetivo();

        const mensagem = [
          "Olá, Fernando! Gostaria de agendar um atendimento.",
          "",
          `Nome: ${estado.nome.trim()}`,
          `WhatsApp: +${codigoPais} ${estado.telefone}`,
          `Data: ${formatarDataBR(estado.data)}`,
          `Horário: ${estado.horario} (horário de Brasília)`,
          `Assunto: ${estado.assunto}`
        ].join("\n");

        const url = `https://wa.me/${WHATSAPP_DESTINO}?text=${encodeURIComponent(mensagem)}`;

        window.open(url, "_blank", "noopener,noreferrer");
      }

      btnAnterior.addEventListener("click", () => {
        if (btnAnterior.disabled) return;

        mesAtual--;

        if (mesAtual < 0) {
          mesAtual = 11;
          anoAtual--;
        }

        renderizarCalendario();
      });

      btnProximo.addEventListener("click", () => {
        mesAtual++;

        if (mesAtual > 11) {
          mesAtual = 0;
          anoAtual++;
        }

        renderizarCalendario();
      });

      btnVoltar.addEventListener("click", () => {
        if (estado.etapa === 0) return;

        estado.etapa--;
        renderizarPopup();
      });

      btnAvancar.addEventListener("click", () => {
        if (!podeAvancar() || estado.etapa === 2) return;

        estado.etapa++;
        renderizarPopup();
      });

      btnConfirmar.addEventListener("click", enviarWhatsApp);

      modalFechar.forEach((botao) => {
        botao.addEventListener("click", fecharModal);
      });

      document.addEventListener("keydown", (evento) => {
        if (evento.key === "Escape" && !modal.hidden) {
          fecharModal();
        }
      });

      renderizarCalendario();
    })();
  </script>
</section>
