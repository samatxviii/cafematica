<!-- =========================================================
     AGENDA CAFEMÁTICA — HTML + CSS + JS EM UM ÚNICO BLOCO
     ========================================================= -->

<section class="agenda-cafematica" id="agenda" data-agenda-cafematica>
  <style>
    .agenda-cafematica {
      --agenda-fundo: #111111;
      --agenda-card: rgba(22, 22, 24, .92);
      --agenda-card-2: rgba(31, 31, 35, .96);
      --agenda-texto: #f8fafc;
      --agenda-suave: #cbd5e1;
      --agenda-mutado: #94a3b8;
      --agenda-borda: rgba(255, 255, 255, .12);
      --agenda-azul: #2563eb;
      --agenda-verde: #16a34a;
      --agenda-cinza: #3f3f46;
      --agenda-cinza-2: #27272a;
      --agenda-amarelo: #facc15;

      position: relative;
      overflow: hidden;
      padding: clamp(3rem, 8vw, 6rem) 1rem;
      color: var(--agenda-texto);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .20), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(22, 163, 74, .12), transparent 30rem),
        var(--agenda-fundo);
    }

    .agenda-cafematica::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .06) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent);
    }

    .agenda-shell {
      width: min(1080px, 100%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .agenda-topo {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .agenda-etiqueta,
    .agenda-popup-etapa {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border: 1px solid rgba(37, 99, 235, .35);
      background: rgba(37, 99, 235, .13);
      color: #bfdbfe;
      border-radius: 999px;
      padding: .35rem .75rem;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .agenda-topo h2 {
      margin: .75rem 0 .5rem;
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 1;
    }

    .agenda-topo p {
      margin: 0 auto;
      max-width: 650px;
      color: var(--agenda-suave);
      font-size: clamp(1rem, 2vw, 1.15rem);
    }

    .agenda-card {
      border: 1px solid var(--agenda-borda);
      background: linear-gradient(145deg, var(--agenda-card), var(--agenda-card-2));
      border-radius: 28px;
      padding: clamp(1rem, 3vw, 1.5rem);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
      backdrop-filter: blur(16px);
    }

    .agenda-calendario-cabecalho {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: .8rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .agenda-calendario-cabecalho h3 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.15rem, 4vw, 1.8rem);
      text-transform: capitalize;
    }

    .agenda-nav {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--agenda-borda);
      background: rgba(255, 255, 255, .06);
      color: var(--agenda-texto);
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, opacity .2s ease;
    }

    .agenda-nav:hover:not(:disabled) {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, .11);
    }

    .agenda-nav:disabled {
      cursor: not-allowed;
      opacity: .35;
    }

    .agenda-semana,
    .agenda-dias {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: .55rem;
    }

    .agenda-semana {
      margin-bottom: .55rem;
    }

    .agenda-semana span {
      text-align: center;
      color: var(--agenda-mutado);
      font-size: .78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .agenda-dia {
      aspect-ratio: 1;
      border: 0;
      border-radius: 16px;
      background: var(--agenda-azul);
      color: #ffffff;
      font-size: clamp(.9rem, 3vw, 1.05rem);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(37, 99, 235, .28);
      transition: transform .2s ease, filter .2s ease, background .2s ease;
    }

    .agenda-dia:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .agenda-dia:disabled {
      background: var(--agenda-cinza-2);
      color: #71717a;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .agenda-dia.vazio {
      visibility: hidden;
      pointer-events: none;
    }

    .agenda-dia.hoje {
      outline: 2px solid rgba(250, 204, 21, .75);
      outline-offset: 2px;
    }

    body.agenda-modal-aberto {
      overflow: hidden;
    }

    .agenda-modal[hidden] {
      display: none !important;
    }

    .agenda-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .agenda-modal-fundo {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .76);
      backdrop-filter: blur(8px);
    }

    .agenda-popup {
      position: relative;
      z-index: 1;
      width: min(680px, 100%);
      max-height: calc(100vh - 2rem);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--agenda-borda);
      border-radius: 28px;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .20), transparent 22rem),
        #111113;
      color: var(--agenda-texto);
      box-shadow: 0 30px 100px rgba(0, 0, 0, .60);
    }

    .agenda-popup-topo {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem 1.2rem .8rem;
      border-bottom: 1px solid var(--agenda-borda);
    }

    .agenda-popup-topo h3 {
      margin: .55rem 0 .2rem;
      font-size: 1.45rem;
    }

    .agenda-popup-topo p {
      margin: 0;
      color: var(--agenda-suave);
      font-size: .95rem;
    }

    .agenda-fechar {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border: 1px solid var(--agenda-borda);
      border-radius: 14px;
      background: rgba(255, 255, 255, .07);
      color: #ffffff;
      font-size: 1.6rem;
      cursor: pointer;
    }

    .agenda-progresso {
      display: flex;
      gap: .45rem;
      padding: .85rem 1.2rem 0;
    }

    .agenda-progresso span {
      height: 7px;
      flex: 1;
      border-radius: 999px;
      background: var(--agenda-cinza-2);
    }

    .agenda-progresso span.ativo {
      background: var(--agenda-azul);
    }

    .agenda-aviso {
      min-height: 1.4rem;
      padding: .7rem 1.2rem 0;
      color: #fca5a5;
      font-weight: 800;
    }

    .agenda-popup-corpo {
      overflow: auto;
      padding: 1rem 1.2rem 1.2rem;
    }

    .agenda-popup-corpo h4 {
      margin: 0 0 .35rem;
      font-size: 1.15rem;
    }

    .agenda-popup-corpo p {
      margin: 0 0 1rem;
      color: var(--agenda-suave);
    }

    .agenda-grade-horarios,
    .agenda-grade-assuntos {
      display: grid;
      gap: .65rem;
    }

    .agenda-grade-horarios {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .agenda-grade-assuntos {
      grid-template-columns: 1fr;
    }

    .agenda-horario,
    .agenda-assunto {
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 16px;
      padding: .9rem .85rem;
      background: var(--agenda-azul);
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: transform .2s ease, filter .2s ease, outline-color .2s ease;
    }

    .agenda-assunto {
      text-align: left;
    }

    .agenda-horario:hover:not(:disabled),
    .agenda-assunto:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .agenda-horario:disabled {
      background: var(--agenda-cinza-2);
      color: #71717a;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .agenda-horario.selecionado,
    .agenda-assunto.selecionado {
      outline: 3px solid var(--agenda-amarelo);
      outline-offset: 2px;
    }

    .agenda-campos {
      display: grid;
      gap: .9rem;
    }

    .agenda-campo label {
      display: block;
      margin-bottom: .35rem;
      color: var(--agenda-suave);
      font-weight: 800;
    }

    .agenda-campo input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--agenda-borda);
      border-radius: 16px;
      background: rgba(255, 255, 255, .07);
      color: #ffffff;
      padding: .95rem 1rem;
      font: inherit;
      outline: none;
    }

    .agenda-campo input:focus {
      border-color: rgba(37, 99, 235, .75);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .18);
    }

    .agenda-ajuda {
      margin-top: .35rem;
      color: var(--agenda-mutado);
      font-size: .85rem;
    }

    .agenda-popup-rodape {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: .7rem;
      padding: 1rem 1.2rem 1.2rem;
      border-top: 1px solid var(--agenda-borda);
      background: rgba(0, 0, 0, .20);
    }

    .agenda-botao {
      min-height: 46px;
      border: 1px solid transparent;
      border-radius: 15px;
      padding: .75rem .9rem;
      font-weight: 900;
      cursor: pointer;
      background: var(--agenda-cinza);
      color: #d4d4d8;
      transition: transform .2s ease, filter .2s ease, background .2s ease;
    }

    .agenda-botao:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.07);
    }

    .agenda-botao:disabled {
      background: #27272a;
      color: #71717a;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .agenda-secundario:not(:disabled) {
      background: rgba(255, 255, 255, .08);
      color: #ffffff;
      border-color: var(--agenda-borda);
    }

    .agenda-primario:not(:disabled),
    .agenda-confirmar:not(:disabled) {
      background: var(--agenda-verde);
      color: #ffffff;
    }


    .agenda-telefone-linha {
      display: grid;
      grid-template-columns: minmax(170px, .85fr) 1fr;
      gap: .6rem;
      align-items: start;
    }

    .agenda-pais-wrap {
      display: grid;
      gap: .5rem;
    }

    .agenda-pais,
    .agenda-codigo-pais {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--agenda-borda);
      border-radius: 16px;
      background: rgba(255, 255, 255, .07);
      color: #ffffff;
      padding: .95rem .8rem;
      font: inherit;
      font-weight: 800;
      outline: none;
    }

    .agenda-pais option {
      color: #111111;
      background: #ffffff;
    }

    .agenda-pais:focus,
    .agenda-codigo-pais:focus {
      border-color: rgba(37, 99, 235, .75);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .18);
    }

    .agenda-codigo-pais[hidden] {
      display: none;
    }



    /* =========================================================
       PAINEL ADMINISTRATIVO DE INDISPONIBILIDADES
       Atalho: Ctrl + Shift + + do teclado numérico
       ========================================================= */

    body.agenda-admin-aberto {
      overflow: hidden;
    }

    .agenda-admin-modal[hidden] {
      display: none !important;
    }

    .agenda-admin-modal {
      --admin-texto: #f8fafc;
      --admin-suave: #cbd5e1;
      --admin-mutado: #94a3b8;
      --admin-borda: rgba(255, 255, 255, .12);
      --admin-azul: #2563eb;
      --admin-verde: #16a34a;
      --admin-cinza: #27272a;
      --admin-cinza-2: #3f3f46;
      --admin-vermelho: #dc2626;
      --admin-amarelo: #facc15;

      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: var(--admin-texto);
    }

    .agenda-admin-fundo {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .82);
      backdrop-filter: blur(10px);
    }

    .agenda-admin-popup {
      position: relative;
      z-index: 1;
      width: min(1040px, 100%);
      max-height: calc(100vh - 2rem);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--admin-borda);
      border-radius: 28px;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .22), transparent 28rem),
        #111113;
      box-shadow: 0 30px 100px rgba(0, 0, 0, .65);
    }

    .agenda-admin-topo {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem;
      border-bottom: 1px solid var(--admin-borda);
    }

    .agenda-admin-topo h3 {
      margin: .45rem 0 .25rem;
      font-size: clamp(1.35rem, 3vw, 1.8rem);
    }

    .agenda-admin-topo p {
      margin: 0;
      color: var(--admin-suave);
    }

    .agenda-admin-etiqueta {
      display: inline-flex;
      width: fit-content;
      border: 1px solid rgba(250, 204, 21, .35);
      background: rgba(250, 204, 21, .12);
      color: #fef3c7;
      border-radius: 999px;
      padding: .35rem .75rem;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .agenda-admin-fechar {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid var(--admin-borda);
      border-radius: 14px;
      background: rgba(255, 255, 255, .07);
      color: #ffffff;
      font-size: 1.6rem;
      cursor: pointer;
    }

    .agenda-admin-corpo {
      overflow: auto;
      padding: 1.2rem;
    }

    .agenda-admin-layout {
      display: grid;
      grid-template-columns: minmax(280px, .95fr) minmax(280px, 1.05fr);
      gap: 1rem;
      align-items: start;
    }

    .agenda-admin-card {
      border: 1px solid var(--admin-borda);
      border-radius: 22px;
      background: rgba(255, 255, 255, .045);
      padding: 1rem;
    }

    .agenda-admin-calendario-topo {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: .65rem;
      margin-bottom: .85rem;
    }

    .agenda-admin-calendario-topo h4,
    .agenda-admin-card h4 {
      margin: 0;
      text-align: center;
      text-transform: capitalize;
      font-size: 1.15rem;
    }

    .agenda-admin-nav,
    .agenda-admin-dia,
    .agenda-admin-horario,
    .agenda-admin-acao,
    .agenda-admin-confirmar,
    .agenda-admin-copiar,
    .agenda-admin-fechar-final {
      border: 1px solid transparent;
      border-radius: 14px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s ease, filter .2s ease, background .2s ease;
    }

    .agenda-admin-nav {
      width: 42px;
      height: 42px;
      border-color: var(--admin-borda);
      background: rgba(255, 255, 255, .07);
      color: #ffffff;
      font-size: 1.8rem;
      line-height: 1;
    }

    .agenda-admin-semana,
    .agenda-admin-dias {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: .4rem;
    }

    .agenda-admin-semana {
      margin-bottom: .45rem;
    }

    .agenda-admin-semana span {
      text-align: center;
      color: var(--admin-mutado);
      font-size: .72rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .agenda-admin-dia {
      aspect-ratio: 1;
      background: var(--admin-azul);
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .24);
    }

    .agenda-admin-dia.vazio {
      visibility: hidden;
      pointer-events: none;
    }

    .agenda-admin-dia:disabled {
      background: #18181b;
      color: #52525b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .agenda-admin-dia.parcial {
      background: #ca8a04;
      box-shadow: 0 8px 18px rgba(202, 138, 4, .20);
    }

    .agenda-admin-dia.indisponivel-total {
      background: var(--admin-cinza-2);
      color: #a1a1aa;
      box-shadow: none;
    }

    .agenda-admin-dia.selecionado {
      outline: 3px solid var(--admin-amarelo);
      outline-offset: 2px;
    }

    .agenda-admin-ajuda {
      margin: .8rem 0 0;
      color: var(--admin-mutado);
      font-size: .9rem;
      text-align: center;
    }

    .agenda-admin-acoes-dia {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .65rem;
      margin: 1rem 0;
    }

    .agenda-admin-acao,
    .agenda-admin-confirmar,
    .agenda-admin-copiar,
    .agenda-admin-fechar-final {
      min-height: 44px;
      padding: .75rem .9rem;
      color: #ffffff;
    }

    .agenda-admin-acao.disponivel {
      background: var(--admin-verde);
    }

    .agenda-admin-acao.indisponivel {
      background: var(--admin-cinza-2);
    }

    .agenda-admin-horarios {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .55rem;
    }

    .agenda-admin-horario {
      min-height: 42px;
      background: var(--admin-azul);
      color: #ffffff;
    }

    .agenda-admin-horario.indisponivel {
      background: var(--admin-cinza-2);
      color: #a1a1aa;
    }

    .agenda-admin-vazio {
      margin: 1rem 0 0;
      color: var(--admin-mutado);
      text-align: center;
    }

    .agenda-admin-gerar-wrap {
      display: flex;
      justify-content: center;
      margin: 1.2rem 0 0;
    }

    .agenda-admin-confirmar {
      background: var(--admin-verde);
      min-width: min(320px, 100%);
    }

    .agenda-admin-codigo {
      margin-top: 1rem;
      border: 1px solid var(--admin-borda);
      border-radius: 20px;
      background: rgba(0, 0, 0, .26);
      padding: 1rem;
    }

    .agenda-admin-codigo textarea {
      width: 100%;
      min-height: 220px;
      box-sizing: border-box;
      border: 1px solid var(--admin-borda);
      border-radius: 16px;
      background: #09090b;
      color: #e5e7eb;
      padding: 1rem;
      font: 500 .86rem/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      resize: vertical;
      outline: none;
    }

    .agenda-admin-codigo-acoes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .7rem;
      margin-top: .9rem;
    }

    .agenda-admin-copiar {
      background: var(--admin-azul);
    }

    .agenda-admin-fechar-final {
      background: rgba(255, 255, 255, .10);
      border-color: var(--admin-borda);
    }

    .agenda-admin-feedback {
      margin-top: .7rem;
      min-height: 1.2rem;
      color: #bbf7d0;
      text-align: center;
      font-weight: 800;
    }

    .agenda-admin-nav:hover:not(:disabled),
    .agenda-admin-dia:hover:not(:disabled),
    .agenda-admin-horario:hover:not(:disabled),
    .agenda-admin-acao:hover:not(:disabled),
    .agenda-admin-confirmar:hover:not(:disabled),
    .agenda-admin-copiar:hover:not(:disabled),
    .agenda-admin-fechar-final:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    @media (max-width: 820px) {
      .agenda-admin-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .agenda-card {
        border-radius: 22px;
      }

      .agenda-semana,
      .agenda-dias {
        gap: .38rem;
      }

      .agenda-dia {
        border-radius: 12px;
      }

      .agenda-popup {
        border-radius: 22px;
      }

      .agenda-popup-topo,
      .agenda-popup-corpo,
      .agenda-popup-rodape {
        padding-left: .9rem;
        padding-right: .9rem;
      }

      .agenda-popup-rodape {
        grid-template-columns: 1fr;
      }

      .agenda-telefone-linha {
        grid-template-columns: 1fr;
      }
    }

  <div class="agenda-shell">
    <div class="agenda-topo">
      <span class="agenda-etiqueta">Atendimento</span>
      <h2>Agende seu atendimento</h2>
      <p>Escolha uma data, um horário e envie sua solicitação pelo WhatsApp.</p>
    </div>

    <div class="agenda-card">
      <div class="agenda-calendario-cabecalho">
        <button class="agenda-nav" type="button" data-agenda-anterior aria-label="Mês anterior">‹</button>
        <h3 data-agenda-mes>Carregando...</h3>
        <button class="agenda-nav" type="button" data-agenda-proximo aria-label="Próximo mês">›</button>
      </div>

  <script>
    (function () {
      document.title = "Agendar";

      const faviconSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <text y=".9em" font-size="90">📅</text>
        </svg>
      `;

      let favicon = document.querySelector("link[rel~='icon']");

      if (!favicon) {
        favicon = document.createElement("link");
        favicon.rel = "icon";
        document.head.appendChild(favicon);
      }

      favicon.type = "image/svg+xml";
      favicon.href = `data:image/svg+xml,${encodeURIComponent(faviconSvg)}`;

      const WHATSAPP_DESTINO = "5567999975834";

      const ASSUNTOS_PREDEFINIDOS = [
        "Aula particular de Matemática",
        "Matemática Básica",
        "Matemática para Concursos",
        "Matemática para o ENEM",
        "Consultoria em LaTeX",
        "Tecnologia e informática",
        "Outro, não está entre os listados"
      ];

      const PAISES_WHATSAPP = [
        { id: "BR", nome: "Brasil", codigo: "55", exemplo: "(67) 99999-9999" },
        { id: "PT", nome: "Portugal", codigo: "351", exemplo: "912 345 678" },
        { id: "US", nome: "Estados Unidos", codigo: "1", exemplo: "555 123 4567" },
        { id: "CA", nome: "Canadá", codigo: "1", exemplo: "555 123 4567" },
        { id: "AR", nome: "Argentina", codigo: "54", exemplo: "9 11 1234-5678" },
        { id: "PY", nome: "Paraguai", codigo: "595", exemplo: "981 123456" },
        { id: "UY", nome: "Uruguai", codigo: "598", exemplo: "99 123 456" },
        { id: "CL", nome: "Chile", codigo: "56", exemplo: "9 1234 5678" },
        { id: "BO", nome: "Bolívia", codigo: "591", exemplo: "71234567" },
        { id: "PE", nome: "Peru", codigo: "51", exemplo: "912 345 678" },
        { id: "CO", nome: "Colômbia", codigo: "57", exemplo: "300 1234567" },
        { id: "MX", nome: "México", codigo: "52", exemplo: "55 1234 5678" },
        { id: "ES", nome: "Espanha", codigo: "34", exemplo: "612 345 678" },
        { id: "FR", nome: "França", codigo: "33", exemplo: "6 12 34 56 78" },
        { id: "IT", nome: "Itália", codigo: "39", exemplo: "312 345 6789" },
        { id: "DE", nome: "Alemanha", codigo: "49", exemplo: "1512 3456789" },
        { id: "GB", nome: "Reino Unido", codigo: "44", exemplo: "7400 123456" },
        { id: "AO", nome: "Angola", codigo: "244", exemplo: "923 123 456" },
        { id: "MZ", nome: "Moçambique", codigo: "258", exemplo: "84 123 4567" },
        { id: "JP", nome: "Japão", codigo: "81", exemplo: "90 1234 5678" },
        { id: "OUTRO", nome: "Outro país", codigo: "", exemplo: "Digite o código do país e o número" }
      ];

      // =========================================================
      // INÍCIO DAS INDISPONIBILIDADES MANUAIS
      // Substitua todo este bloco pelo código gerado no painel secreto.
      const HORARIOS_INDISPONIVEIS = {
        // Exemplo:
        // "2026-05-30": ["09:00", "15:00"],
        // "2026-06-01": ["07:00", "08:00", "20:00"]
      };
      let indisponibilidadesEditaveis = {};
      // FIM DAS INDISPONIBILIDADES MANUAIS

      const agenda = document.querySelector("[data-agenda-cafematica]");
      if (!agenda) return;

      const elMes = agenda.querySelector("[data-agenda-mes]");
      const elDias = agenda.querySelector("[data-agenda-dias]");
      const btnAnterior = agenda.querySelector("[data-agenda-anterior]");
      const btnProximo = agenda.querySelector("[data-agenda-proximo]");

      const modal = agenda.querySelector("[data-agenda-modal]");
      const modalFechar = agenda.querySelectorAll("[data-agenda-fechar]");
      const elEtapa = agenda.querySelector("[data-agenda-etapa]");
      const elResumo = agenda.querySelector("[data-agenda-resumo]");
      const elAviso = agenda.querySelector("[data-agenda-aviso]");
      const elCorpo = agenda.querySelector("[data-agenda-corpo]");
      const btnVoltar = agenda.querySelector("[data-agenda-voltar]");
      const btnConfirmar = agenda.querySelector("[data-agenda-confirmar]");
      const btnAvancar = agenda.querySelector("[data-agenda-avancar]");
      const bolinhas = agenda.querySelectorAll("[data-agenda-bolinha]");

      const hojeIso = obterHojeBrasiliaIso();
      const [anoHoje, mesHoje] = hojeIso.split("-").map(Number);

      let anoAtual = anoHoje;
      let mesAtual = mesHoje - 1;

      const estado = {
        etapa: 0,
        data: "",
        horario: "",
        assunto: "",
        nome: "",
        paisId: "BR",
        paisCodigo: "55",
        paisCodigoManual: "",
        telefone: ""
      };

      function obterHojeBrasiliaIso() {
        const partes = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Sao_Paulo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());

        const mapa = {};
        partes.forEach((parte) => {
          mapa[parte.type] = parte.value;
        });

        return `${mapa.year}-${mapa.month}-${mapa.day}`;
      }

      function obterPaisSelecionado() {
        return PAISES_WHATSAPP.find((pais) => pais.id === estado.paisId) || PAISES_WHATSAPP[0];
      }

      function obterCodigoPaisEfetivo() {
        if (estado.paisId === "OUTRO") {
          return estado.paisCodigoManual.replace(/\D/g, "");
        }

        return estado.paisCodigo.replace(/\D/g, "");
      }


      function criarDataBrasilia(dataIso, horario) {
        return new Date(`${dataIso}T${horario}:00-03:00`);
      }

      function horarioBloqueadoPorAntecedencia(dataIso, horario) {
        const oitoHorasEmMs = 8 * 60 * 60 * 1000;
        const limiteMinimo = new Date(Date.now() + oitoHorasEmMs);
        const dataHorarioEscolhido = criarDataBrasilia(dataIso, horario);

        return dataHorarioEscolhido.getTime() < limiteMinimo.getTime();
      }

      function diaTemAlgumHorarioPermitido(dataIso) {
        return gerarHorarios().some((horario) => !horarioIndisponivel(dataIso, horario));
      }

      function criarIso(ano, mesZero, dia) {
        const mes = String(mesZero + 1).padStart(2, "0");
        const diaFormatado = String(dia).padStart(2, "0");
        return `${ano}-${mes}-${diaFormatado}`;
      }

      function formatarDataBR(iso) {
        const [ano, mes, dia] = iso.split("-");
        return `${dia}/${mes}/${ano}`;
      }

      function nomeDoMes(ano, mesZero) {
        const data = new Date(ano, mesZero, 1, 12);
        return new Intl.DateTimeFormat("pt-BR", {
          month: "long",
          year: "numeric"
        }).format(data);
      }

      function gerarHorarios() {
  const horarios = [];

  for (let hora = 7; hora <= 22; hora++) {
    horarios.push(`${String(hora).padStart(2, "0")}:00`);
  }

  return horarios;
}

      function horarioIndisponivel(dataIso, horario) {
        const horariosDoDia = indisponibilidadesEditaveis[dataIso] || [];
        const diaTodoIndisponivel = horariosDoDia.includes("DIA_TODO");
        const indisponivelManual = horariosDoDia.includes(horario);
        const indisponivelPelaAntecedencia = horarioBloqueadoPorAntecedencia(dataIso, horario);

        return diaTodoIndisponivel || indisponivelManual || indisponivelPelaAntecedencia;
      }

      function renderizarCalendario() {
        elMes.textContent = nomeDoMes(anoAtual, mesAtual);
        elDias.innerHTML = "";

        const primeiroDiaSemana = new Date(anoAtual, mesAtual, 1).getDay();
        const totalDias = new Date(anoAtual, mesAtual + 1, 0).getDate();

        for (let i = 0; i < primeiroDiaSemana; i++) {
          const vazio = document.createElement("span");
          vazio.className = "agenda-dia vazio";
          elDias.appendChild(vazio);
        }

        for (let dia = 1; dia <= totalDias; dia++) {
          const dataIso = criarIso(anoAtual, mesAtual, dia);
          const passado = dataIso < hojeIso || !diaTemAlgumHorarioPermitido(dataIso);

          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-dia";
          botao.textContent = dia;

          if (dataIso === hojeIso) {
            botao.classList.add("hoje");
          }

          if (passado) {
            botao.disabled = true;
            botao.setAttribute("aria-label", `${formatarDataBR(dataIso)} indisponível`);
          } else {
            botao.setAttribute("aria-label", `Agendar em ${formatarDataBR(dataIso)}`);
            botao.addEventListener("click", () => abrirModal(dataIso));
          }

          elDias.appendChild(botao);
        }

        const estaNoMesAtualOuAnterior =
          anoAtual < anoHoje ||
          (anoAtual === anoHoje && mesAtual <= mesHoje - 1);

        btnAnterior.disabled = estaNoMesAtualOuAnterior;
      }

      function abrirModal(dataIso) {
        estado.etapa = 0;
        estado.data = dataIso;
        estado.horario = "";
        estado.assunto = "";
        estado.nome = "";
        estado.paisId = "BR";
        estado.paisCodigo = "55";
        estado.paisCodigoManual = "";
        estado.telefone = "";

        modal.hidden = false;
        document.body.classList.add("agenda-modal-aberto");

        renderizarPopup();
      }

      function fecharModal() {
        modal.hidden = true;
        document.body.classList.remove("agenda-modal-aberto");
      }

      function renderizarPopup() {
        elEtapa.textContent = `Etapa ${estado.etapa + 1} de 3`;
        elResumo.textContent = `Data escolhida: ${formatarDataBR(estado.data)}`;

        bolinhas.forEach((bolinha, indice) => {
          bolinha.classList.toggle("ativo", indice <= estado.etapa);
        });

        elAviso.textContent = "";

        if (estado.etapa === 0) {
          renderizarEtapaHorarios();
        }

        if (estado.etapa === 1) {
          renderizarEtapaAssunto();
        }

        if (estado.etapa === 2) {
          renderizarEtapaDados();
        }

        atualizarBotoes();
      }

      function renderizarEtapaHorarios() {
        const horarios = gerarHorarios();

        elCorpo.innerHTML = `
          <h4>Escolha o horário de início</h4>
          <p>Horários disponíveis das 7h00 às 22h00, pelo horário de Brasília.</p>
          <div class="agenda-grade-horarios"></div>
        `;

        const grade = elCorpo.querySelector(".agenda-grade-horarios");

        horarios.forEach((horario) => {
          const indisponivel = horarioIndisponivel(estado.data, horario);

          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-horario";
          botao.textContent = horario;
          botao.disabled = indisponivel;

          if (estado.horario === horario) {
            botao.classList.add("selecionado");
          }

          if (indisponivel) {
            botao.title = "Este horário está indisponível.";
          } else {
            botao.addEventListener("click", () => {
              estado.horario = horario;
              renderizarPopup();
            });
          }

          grade.appendChild(botao);
        });
      }

      function renderizarEtapaAssunto() {
        elCorpo.innerHTML = `
          <h4>Sobre qual assunto você deseja atendimento?</h4>
          <p>Escolha uma das opções abaixo.</p>
          <div class="agenda-grade-assuntos"></div>
        `;

        const grade = elCorpo.querySelector(".agenda-grade-assuntos");

        ASSUNTOS_PREDEFINIDOS.forEach((assunto) => {
          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-assunto";
          botao.textContent = assunto;

          if (estado.assunto === assunto) {
            botao.classList.add("selecionado");
          }

          botao.addEventListener("click", () => {
            estado.assunto = assunto;
            renderizarPopup();
          });

          grade.appendChild(botao);
        });
      }

      function renderizarEtapaDados() {
        const paisSelecionado = obterPaisSelecionado();
        const usandoPaisManual = estado.paisId === "OUTRO";
        const codigoAtual = obterCodigoPaisEfetivo();
        const exemploTelefone = usandoPaisManual
          ? "Digite apenas o número, sem o código do país"
          : paisSelecionado.exemplo;

        elCorpo.innerHTML = `
          <h4>Informe seus dados</h4>
          <p>Preencha seu nome e seu WhatsApp para finalizar a solicitação.</p>

          <div class="agenda-campos">
            <div class="agenda-campo">
              <label for="agendaNome">Nome</label>
              <input id="agendaNome" type="text" autocomplete="name" placeholder="Seu nome completo">
            </div>

            <div class="agenda-campo">
              <label for="agendaTelefone">WhatsApp</label>

              <div class="agenda-telefone-linha">
                <div class="agenda-pais-wrap">
                  <select id="agendaPais" class="agenda-pais" aria-label="País do WhatsApp">
                    ${PAISES_WHATSAPP.map((pais) => {
                      const texto = pais.codigo
                        ? `${pais.nome} +${pais.codigo}`
                        : pais.nome;

                      return `
                        <option value="${pais.id}" ${pais.id === estado.paisId ? "selected" : ""}>
                          ${texto}
                        </option>
                      `;
                    }).join("")}
                  </select>

                  <input
                    id="agendaCodigoPais"
                    class="agenda-codigo-pais"
                    type="tel"
                    inputmode="numeric"
                    placeholder="Código do país. Ex.: 351"
                    value="${estado.paisCodigoManual}"
                    ${usandoPaisManual ? "" : "hidden"}
                  >
                </div>

                <input id="agendaTelefone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="${exemploTelefone}">
              </div>

              <div class="agenda-ajuda" data-agenda-ajuda-telefone>
                ${usandoPaisManual
                  ? "Escolha ‘Outro país’, informe o código internacional à esquerda e o número à direita."
                  : `Exemplo: +${codigoAtual} ${paisSelecionado.exemplo}`
                }
              </div>
            </div>
          </div>
        `;

        const inputNome = elCorpo.querySelector("#agendaNome");
        const selectPais = elCorpo.querySelector("#agendaPais");
        const inputCodigoPais = elCorpo.querySelector("#agendaCodigoPais");
        const inputTelefone = elCorpo.querySelector("#agendaTelefone");

        inputNome.value = estado.nome;
        inputTelefone.value = estado.telefone;

        inputNome.addEventListener("input", () => {
          estado.nome = inputNome.value;
          atualizarBotoes();
        });

        selectPais.addEventListener("change", () => {
          const novoPais = PAISES_WHATSAPP.find((pais) => pais.id === selectPais.value) || PAISES_WHATSAPP[0];

          estado.paisId = novoPais.id;
          estado.paisCodigo = novoPais.codigo;
          estado.paisCodigoManual = "";
          estado.telefone = "";

          renderizarPopup();
        });

        inputCodigoPais.addEventListener("input", () => {
          inputCodigoPais.value = inputCodigoPais.value.replace(/\D/g, "").slice(0, 4);
          estado.paisCodigoManual = inputCodigoPais.value;
          atualizarBotoes();
        });

        inputTelefone.addEventListener("input", () => {
          if (obterCodigoPaisEfetivo() === "55") {
            inputTelefone.value = mascararTelefone(inputTelefone.value);
          }

          estado.telefone = inputTelefone.value;
          atualizarBotoes();
        });

        inputNome.focus();
      }

      function mascararTelefone(valor) {
        const numeros = valor.replace(/\D/g, "").slice(0, 11);

        if (numeros.length <= 2) {
          return numeros;
        }

        if (numeros.length <= 6) {
          return `(${numeros.slice(0, 2)}) ${numeros.slice(2)}`;
        }

        if (numeros.length <= 10) {
          return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 6)}-${numeros.slice(6)}`;
        }

        return `(${numeros.slice(0, 2)}) ${numeros.slice(2, 7)}-${numeros.slice(7)}`;
      }

      function telefoneValido(valor) {
        const codigoPais = obterCodigoPaisEfetivo();
        const numero = valor.replace(/\D/g, "");

        if (!codigoPais || codigoPais.length < 1 || codigoPais.length > 4) {
          return false;
        }

        if (numero.length < 6 || numero.length > 15) {
          return false;
        }

        if (/^(\d)\1+$/.test(numero)) {
          return false;
        }

        if (codigoPais === "55") {
          if (!/^[1-9]{2}\d{8,9}$/.test(numero)) {
            return false;
          }

          const ddd = Number(numero.slice(0, 2));

          if (ddd < 11 || ddd > 99) {
            return false;
          }

          if (numero.length === 11 && numero[2] !== "9") {
            return false;
          }
        }

        return true;
      }

      function podeAvancar() {
        if (estado.etapa === 0) {
          return Boolean(estado.horario);
        }

        if (estado.etapa === 1) {
          return Boolean(estado.assunto);
        }

        return false;
      }

      function podeConfirmar() {
        const nomeOk = estado.nome.trim().length >= 2;
        const telefoneOk = telefoneValido(estado.telefone);

        const dadosBasicosOk = Boolean(
          estado.data &&
          estado.horario &&
          estado.assunto &&
          nomeOk &&
          telefoneOk
        );

        const indisponivel = horarioIndisponivel(estado.data, estado.horario);

        if (estado.etapa === 2 && indisponivel) {
          elAviso.textContent = "Este horário está indisponível.";
        } else {
          elAviso.textContent = "";
        }

        return dadosBasicosOk && !indisponivel;
      }

      function atualizarBotoes() {
        btnVoltar.disabled = estado.etapa === 0;
        btnAvancar.disabled = estado.etapa === 2 || !podeAvancar();
        btnConfirmar.disabled = !podeConfirmar();
      }

      function enviarWhatsApp() {
        if (!podeConfirmar()) return;

        const codigoPais = obterCodigoPaisEfetivo();

        const mensagem = [
          "Olá, Fernando! Gostaria de agendar um atendimento.",
          "",
          `Nome: ${estado.nome.trim()}`,
          `WhatsApp: +${codigoPais} ${estado.telefone}`,
          `Data: ${formatarDataBR(estado.data)}`,
          `Horário: ${estado.horario} (horário de Brasília)`,
          `Assunto: ${estado.assunto}`
        ].join("\n");

        const url = `https://wa.me/${WHATSAPP_DESTINO}?text=${encodeURIComponent(mensagem)}`;

        window.open(url, "_blank", "noopener,noreferrer");
      }



      function clonarIndisponibilidades(origem) {
        const copia = {};

        Object.keys(origem || {}).forEach((dataIso) => {
          if (Array.isArray(origem[dataIso])) {
            copia[dataIso] = [...new Set(origem[dataIso])];
          }
        });

        return copia;
      }

      function horariosOrdenados(horarios) {
        const ordem = gerarHorarios();

        return [...new Set(horarios)]
          .filter((horario) => horario === "DIA_TODO" || ordem.includes(horario))
          .sort((a, b) => ordem.indexOf(a) - ordem.indexOf(b));
      }

      function obterHorariosManuais(dataIso) {
        const horariosDoDia = indisponibilidadesEditaveis[dataIso] || [];

        if (horariosDoDia.includes("DIA_TODO")) {
          return gerarHorarios();
        }

        return horariosOrdenados(horariosDoDia);
      }

      function definirHorariosManuais(dataIso, horarios) {
        const horariosLimpos = horariosOrdenados(horarios).filter((horario) => horario !== "DIA_TODO");

        if (horariosLimpos.length === 0) {
          delete indisponibilidadesEditaveis[dataIso];
          return;
        }

        indisponibilidadesEditaveis[dataIso] = horariosLimpos;
      }

      let adminModal = null;
      let adminAnoAtual = anoHoje;
      let adminMesAtual = mesHoje - 1;
      let adminDataSelecionada = "";

      function criarPainelAdmin() {
        adminModal = document.createElement("div");
        adminModal.className = "agenda-admin-modal";
        adminModal.hidden = true;
        adminModal.innerHTML = `
          <div class="agenda-admin-fundo" data-admin-fechar></div>

          <div class="agenda-admin-popup" role="dialog" aria-modal="true" aria-labelledby="agendaAdminTitulo">
            <div class="agenda-admin-topo">
              <div>
                <span class="agenda-admin-etiqueta">Painel secreto</span>
                <h3 id="agendaAdminTitulo">Indisponibilidades da agenda</h3>
                <p>Escolha um dia, altere os horários e gere o código para substituir no arquivo HTML.</p>
              </div>

              <button class="agenda-admin-fechar" type="button" data-admin-fechar aria-label="Fechar">×</button>
            </div>

            <div class="agenda-admin-corpo">
              <div class="agenda-admin-layout">
                <div class="agenda-admin-card">
                  <div class="agenda-admin-calendario-topo">
                    <button class="agenda-admin-nav" type="button" data-admin-mes-anterior aria-label="Mês anterior">‹</button>
                    <h4 data-admin-mes>Carregando...</h4>
                    <button class="agenda-admin-nav" type="button" data-admin-mes-proximo aria-label="Próximo mês">›</button>
                  </div>

                  <div class="agenda-admin-semana">
                    <span>Dom</span>
                    <span>Seg</span>
                    <span>Ter</span>
                    <span>Qua</span>
                    <span>Qui</span>
                    <span>Sex</span>
                    <span>Sáb</span>
                  </div>

                  <div class="agenda-admin-dias" data-admin-dias></div>
                  <p class="agenda-admin-ajuda">Azul: livre. Amarelo: parcialmente bloqueado. Cinza: dia todo bloqueado.</p>
                </div>

                <div class="agenda-admin-card">
                  <h4 data-admin-data-titulo>Escolha um dia no calendário</h4>

                  <div class="agenda-admin-acoes-dia">
                    <button class="agenda-admin-acao disponivel" type="button" data-admin-tudo-disponivel>
                      Tudo disponível
                    </button>
                    <button class="agenda-admin-acao indisponivel" type="button" data-admin-tudo-indisponivel>
                      Tudo indisponível
                    </button>
                  </div>

                  <div class="agenda-admin-horarios" data-admin-horarios>
                    <p class="agenda-admin-vazio">Clique em uma data para editar os horários.</p>
                  </div>
                </div>
              </div>

              <div class="agenda-admin-gerar-wrap">
                <button class="agenda-admin-confirmar" type="button" data-admin-gerar-codigo>
                  Confirmar indisponibilidades
                </button>
              </div>

              <div class="agenda-admin-codigo" data-admin-codigo-wrap hidden>
                <textarea data-admin-codigo readonly></textarea>

                <div class="agenda-admin-codigo-acoes">
                  <button class="agenda-admin-copiar" type="button" data-admin-copiar>
                    Copiar código
                  </button>
                  <button class="agenda-admin-fechar-final" type="button" data-admin-confirmar-final>
                    Confirmar e fechar
                  </button>
                </div>

                <div class="agenda-admin-feedback" data-admin-feedback></div>
              </div>
            </div>
          </div>
        `;

        document.body.appendChild(adminModal);

        adminModal.querySelectorAll("[data-admin-fechar]").forEach((botao) => {
          botao.addEventListener("click", fecharPainelAdmin);
        });

        adminModal.querySelector("[data-admin-mes-anterior]").addEventListener("click", () => {
          adminMesAtual--;

          if (adminMesAtual < 0) {
            adminMesAtual = 11;
            adminAnoAtual--;
          }

          renderizarPainelAdmin();
        });

        adminModal.querySelector("[data-admin-mes-proximo]").addEventListener("click", () => {
          adminMesAtual++;

          if (adminMesAtual > 11) {
            adminMesAtual = 0;
            adminAnoAtual++;
          }

          renderizarPainelAdmin();
        });

        adminModal.querySelector("[data-admin-tudo-disponivel]").addEventListener("click", () => {
          if (!adminDataSelecionada) return;

          definirHorariosManuais(adminDataSelecionada, []);
          limparCodigoAdminGerado();
          renderizarPainelAdmin();
          renderizarCalendario();
        });

        adminModal.querySelector("[data-admin-tudo-indisponivel]").addEventListener("click", () => {
          if (!adminDataSelecionada) return;

          definirHorariosManuais(adminDataSelecionada, gerarHorarios());
          limparCodigoAdminGerado();
          renderizarPainelAdmin();
          renderizarCalendario();
        });

        adminModal.querySelector("[data-admin-gerar-codigo]").addEventListener("click", gerarCodigoAdmin);
        adminModal.querySelector("[data-admin-copiar]").addEventListener("click", copiarCodigoAdmin);
        adminModal.querySelector("[data-admin-confirmar-final]").addEventListener("click", fecharPainelAdmin);
      }

      function abrirPainelAdmin() {
        if (!adminModal) return;

        adminAnoAtual = anoHoje;
        adminMesAtual = mesHoje - 1;
        adminDataSelecionada = "";

        adminModal.hidden = false;
        document.body.classList.add("agenda-admin-aberto");
        limparCodigoAdminGerado();
        renderizarPainelAdmin();
      }

      function fecharPainelAdmin() {
        if (!adminModal) return;

        adminModal.hidden = true;
        document.body.classList.remove("agenda-admin-aberto");
      }

      function renderizarPainelAdmin() {
        if (!adminModal) return;

        const elAdminMes = adminModal.querySelector("[data-admin-mes]");
        const elAdminDias = adminModal.querySelector("[data-admin-dias]");
        const btnAdminAnterior = adminModal.querySelector("[data-admin-mes-anterior]");

        elAdminMes.textContent = nomeDoMes(adminAnoAtual, adminMesAtual);
        elAdminDias.innerHTML = "";

        const primeiroDiaSemana = new Date(adminAnoAtual, adminMesAtual, 1).getDay();
        const totalDias = new Date(adminAnoAtual, adminMesAtual + 1, 0).getDate();

        for (let i = 0; i < primeiroDiaSemana; i++) {
          const vazio = document.createElement("span");
          vazio.className = "agenda-admin-dia vazio";
          elAdminDias.appendChild(vazio);
        }

        for (let dia = 1; dia <= totalDias; dia++) {
          const dataIso = criarIso(adminAnoAtual, adminMesAtual, dia);
          const horariosManuais = obterHorariosManuais(dataIso);
          const totalHorarios = gerarHorarios().length;
          const passado = dataIso < hojeIso;

          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-admin-dia";
          botao.textContent = dia;

          if (horariosManuais.length > 0 && horariosManuais.length < totalHorarios) {
            botao.classList.add("parcial");
          }

          if (horariosManuais.length === totalHorarios) {
            botao.classList.add("indisponivel-total");
          }

          if (dataIso === adminDataSelecionada) {
            botao.classList.add("selecionado");
          }

          if (passado) {
            botao.disabled = true;
          } else {
            botao.addEventListener("click", () => {
              adminDataSelecionada = dataIso;
              limparCodigoAdminGerado();
              renderizarPainelAdmin();
            });
          }

          elAdminDias.appendChild(botao);
        }

        const estaNoMesAtualOuAnterior =
          adminAnoAtual < anoHoje ||
          (adminAnoAtual === anoHoje && adminMesAtual <= mesHoje - 1);

        btnAdminAnterior.disabled = estaNoMesAtualOuAnterior;

        renderizarHorariosAdmin();
      }

      function renderizarHorariosAdmin() {
        const titulo = adminModal.querySelector("[data-admin-data-titulo]");
        const grade = adminModal.querySelector("[data-admin-horarios]");
        const btnTudoDisponivel = adminModal.querySelector("[data-admin-tudo-disponivel]");
        const btnTudoIndisponivel = adminModal.querySelector("[data-admin-tudo-indisponivel]");

        grade.innerHTML = "";
        btnTudoDisponivel.disabled = !adminDataSelecionada;
        btnTudoIndisponivel.disabled = !adminDataSelecionada;

        if (!adminDataSelecionada) {
          titulo.textContent = "Escolha um dia no calendário";
          grade.innerHTML = `<p class="agenda-admin-vazio">Clique em uma data para editar os horários.</p>`;
          return;
        }

        titulo.textContent = `Horários de ${formatarDataBR(adminDataSelecionada)}`;

        const horariosManuais = obterHorariosManuais(adminDataSelecionada);

        gerarHorarios().forEach((horario) => {
          const indisponivel = horariosManuais.includes(horario);
          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-admin-horario";
          botao.textContent = horario;

          if (indisponivel) {
            botao.classList.add("indisponivel");
            botao.title = "Indisponível. Clique para tornar disponível.";
          } else {
            botao.title = "Disponível. Clique para tornar indisponível.";
          }

          botao.addEventListener("click", () => {
            const horariosAtuais = obterHorariosManuais(adminDataSelecionada);

            if (horariosAtuais.includes(horario)) {
              definirHorariosManuais(
                adminDataSelecionada,
                horariosAtuais.filter((item) => item !== horario)
              );
            } else {
              definirHorariosManuais(adminDataSelecionada, [...horariosAtuais, horario]);
            }

            limparCodigoAdminGerado();
            renderizarPainelAdmin();
            renderizarCalendario();
          });

          grade.appendChild(botao);
        });
      }

      function montarObjetoIndisponibilidadesParaCodigo() {
        const objeto = {};

        Object.keys(indisponibilidadesEditaveis)
          .sort()
          .forEach((dataIso) => {
            const horarios = obterHorariosManuais(dataIso);

            if (horarios.length > 0) {
              objeto[dataIso] = horariosOrdenados(horarios);
            }
          });

        return objeto;
      }

      function gerarBlocoIndisponibilidades() {
        const objeto = montarObjetoIndisponibilidadesParaCodigo();
        const json = JSON.stringify(objeto, null, 2)
          .split("\n")
          .map((linha, indice) => indice === 0 ? linha : `      ${linha}`)
          .join("\n");

        return [
          "      // =========================================================",
          "      // INÍCIO DAS INDISPONIBILIDADES MANUAIS",
          "      // Substitua todo este bloco pelo código gerado no painel secreto.",
          `      const HORARIOS_INDISPONIVEIS = ${json};`,
          "      let indisponibilidadesEditaveis = {};",
          "      // FIM DAS INDISPONIBILIDADES MANUAIS"
        ].join("\n");
      }

      function gerarCodigoAdmin() {
        const wrap = adminModal.querySelector("[data-admin-codigo-wrap]");
        const textarea = adminModal.querySelector("[data-admin-codigo]");
        const feedback = adminModal.querySelector("[data-admin-feedback]");

        textarea.value = gerarBlocoIndisponibilidades();
        wrap.hidden = false;
        feedback.textContent = "Código gerado. Copie e substitua o bloco marcado no arquivo agendar.html.";
      }

      async function copiarCodigoAdmin() {
        const textarea = adminModal.querySelector("[data-admin-codigo]");
        const feedback = adminModal.querySelector("[data-admin-feedback]");

        if (!textarea.value.trim()) {
          gerarCodigoAdmin();
        }

        try {
          await navigator.clipboard.writeText(textarea.value);
          feedback.textContent = "Código copiado para a área de transferência.";
        } catch (erro) {
          textarea.focus();
          textarea.select();
          document.execCommand("copy");
          feedback.textContent = "Código selecionado/copiado. Se necessário, use Ctrl+C.";
        }
      }

      function limparCodigoAdminGerado() {
        if (!adminModal) return;

        const wrap = adminModal.querySelector("[data-admin-codigo-wrap]");
        const textarea = adminModal.querySelector("[data-admin-codigo]");
        const feedback = adminModal.querySelector("[data-admin-feedback]");

        if (wrap) wrap.hidden = true;
        if (textarea) textarea.value = "";
        if (feedback) feedback.textContent = "";
      }

      btnAnterior.addEventListener("click", () => {
        if (btnAnterior.disabled) return;

        mesAtual--;

        if (mesAtual < 0) {
          mesAtual = 11;
          anoAtual--;
        }

        renderizarCalendario();
      });

      btnProximo.addEventListener("click", () => {
        mesAtual++;

        if (mesAtual > 11) {
          mesAtual = 0;
          anoAtual++;
        }

        renderizarCalendario();
      });

      btnVoltar.addEventListener("click", () => {
        if (estado.etapa === 0) return;

        estado.etapa--;
        renderizarPopup();
      });

      btnAvancar.addEventListener("click", () => {
        if (!podeAvancar() || estado.etapa === 2) return;

        estado.etapa++;
        renderizarPopup();
      });

      btnConfirmar.addEventListener("click", enviarWhatsApp);

      modalFechar.forEach((botao) => {
        botao.addEventListener("click", fecharModal);
      });

      document.addEventListener("keydown", (evento) => {
        const atalhoPainelAdmin =
          evento.ctrlKey &&
          evento.shiftKey &&
          (
            evento.code === "NumpadAdd" ||
            (evento.key === "+" && evento.location === 3)
          );

        if (atalhoPainelAdmin) {
          evento.preventDefault();
          abrirPainelAdmin();
          return;
        }

        if (evento.key === "Escape" && adminModal && !adminModal.hidden) {
          fecharPainelAdmin();
          return;
        }

        if (evento.key === "Escape" && !modal.hidden) {
          fecharModal();
        }
      });

      indisponibilidadesEditaveis = clonarIndisponibilidades(HORARIOS_INDISPONIVEIS);
      criarPainelAdmin();
      renderizarCalendario();
    })();
  </script>
</section>
