<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agendar</title>
  <meta name="theme-color" content="#111111">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111111;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .agenda-cafematica {
      --agenda-fundo: #111111;
      --agenda-card: rgba(22, 22, 24, .92);
      --agenda-card-2: rgba(31, 31, 35, .96);
      --agenda-texto: #f8fafc;
      --agenda-suave: #cbd5e1;
      --agenda-mutado: #94a3b8;
      --agenda-borda: rgba(255, 255, 255, .12);
      --agenda-azul: #2563eb;
      --agenda-verde: #16a34a;
      --agenda-cinza: #3f3f46;
      --agenda-cinza-2: #27272a;
      --agenda-amarelo: #facc15;
      --agenda-vermelho: #dc2626;

      position: relative;
      overflow: hidden;
      min-height: 100vh;
      padding: clamp(3rem, 8vw, 6rem) 1rem;
      color: var(--agenda-texto);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .20), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(22, 163, 74, .12), transparent 30rem),
        var(--agenda-fundo);
    }

    .agenda-cafematica::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .06) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent);
    }

    .agenda-shell {
      width: min(1080px, 100%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .agenda-topo {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .agenda-etiqueta,
    .agenda-popup-etapa,
    .agenda-admin-etiqueta {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      padding: .35rem .75rem;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .agenda-etiqueta,
    .agenda-popup-etapa {
      border: 1px solid rgba(37, 99, 235, .35);
      background: rgba(37, 99, 235, .13);
      color: #bfdbfe;
    }

    .agenda-topo h1 {
      margin: .75rem 0 .5rem;
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 1;
    }

    .agenda-topo p {
      margin: 0 auto;
      max-width: 650px;
      color: var(--agenda-suave);
      font-size: clamp(1rem, 2vw, 1.15rem);
    }

    .agenda-card {
      border: 1px solid var(--agenda-borda);
      background: linear-gradient(145deg, var(--agenda-card), var(--agenda-card-2));
      border-radius: 28px;
      padding: clamp(1rem, 3vw, 1.5rem);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
      backdrop-filter: blur(16px);
    }

    .agenda-calendario-cabecalho {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: .8rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .agenda-calendario-cabecalho h2 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.15rem, 4vw, 1.8rem);
      text-transform: capitalize;
    }

    .agenda-nav {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--agenda-borda);
      background: rgba(255, 255, 255, .06);
      color: var(--agenda-texto);
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, opacity .2s ease;
    }

    .agenda-nav:hover:not(:disabled) {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, .11);
    }

    .agenda-nav:disabled {
      cursor: not-allowed;
      opacity: .35;
    }

    .agenda-semana,
    .agenda-dias {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: .55rem;
    }

    .agenda-semana {
      margin-bottom: .55rem;
    }

    .agenda-semana span {
      text-align: center;
      color: var(--agenda-mutado);
      font-size: .78rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .agenda-dia {
      aspect-ratio: 1;
      border: 0;
      border-radius: 16px;
      background: var(--agenda-azul);
      color: #ffffff;
      font-size: clamp(.9rem, 3vw, 1.05rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(37, 99, 235, .28);
      transition: transform .2s ease, filter .2s ease, background .2s ease;
    }

    .agenda-dia:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .agenda-dia:disabled {
      background: var(--agenda-cinza-2);
      color: #71717a;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .agenda-dia.vazio {
      visibility: hidden;
      pointer-events: none;
    }

    .agenda-dia.hoje {
      outline: 2px solid rgba(250, 204, 21, .75);
      outline-offset: 2px;
    }

    body.agenda-modal-aberto,
    body.agenda-admin-aberto {
      overflow: hidden;
    }

    .agenda-modal[hidden],
    .agenda-admin-modal[hidden] {
      display: none !important;
    }

    .agenda-modal,
    .agenda-admin-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .agenda-admin-modal {
      z-index: 10000;
    }

    .agenda-modal-fundo,
    .agenda-admin-fundo {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .78);
      backdrop-filter: blur(8px);
    }

    .agenda-admin-fundo {
      background: rgba(0, 0, 0, .84);
      backdrop-filter: blur(10px);
    }

    .agenda-popup,
    .agenda-admin-popup {
      position: relative;
      z-index: 1;
      max-height: calc(100vh - 2rem);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--agenda-borda);
      border-radius: 28px;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .20), transparent 22rem),
        #111113;
      color: var(--agenda-texto);
      box-shadow: 0 30px 100px rgba(0, 0, 0, .60);
    }

    .agenda-popup {
      width: min(720px, 100%);
    }

    .agenda-admin-popup {
      width: min(1120px, 100%);
    }

    .agenda-popup-topo,
    .agenda-admin-topo {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem;
      border-bottom: 1px solid var(--agenda-borda);
    }

    .agenda-popup-topo h3,
    .agenda-admin-topo h3 {
      margin: .55rem 0 .2rem;
      font-size: clamp(1.35rem, 3vw, 1.8rem);
    }

    .agenda-popup-topo p,
    .agenda-admin-topo p {
      margin: 0;
      color: var(--agenda-suave);
      font-size: .95rem;
    }

    .agenda-fechar,
    .agenda-admin-fechar {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid var(--agenda-borda);
      border-radius: 14px;
      background: rgba(255, 255, 255, .07);
      color: #ffffff;
      font-size: 1.6rem;
      cursor: pointer;
    }

    .agenda-progresso {
      display: flex;
      gap: .45rem;
      padding: .85rem 1.2rem 0;
    }

    .agenda-progresso span {
      height: 7px;
      flex: 1;
      border-radius: 999px;
      background: var(--agenda-cinza-2);
    }

    .agenda-progresso span.ativo {
      background: var(--agenda-azul);
    }

    .agenda-aviso {
      min-height: 1.4rem;
      padding: .7rem 1.2rem 0;
      color: #fca5a5;
      font-weight: 800;
    }

    .agenda-popup-corpo,
    .agenda-admin-corpo {
      overflow: auto;
      padding: 1rem 1.2rem 1.2rem;
    }

    .agenda-popup-corpo h4,
    .agenda-admin-card h4 {
      margin: 0 0 .35rem;
      font-size: 1.15rem;
    }

    .agenda-popup-corpo p {
      margin: 0 0 1rem;
      color: var(--agenda-suave);
    }

    .agenda-grade-horarios,
    .agenda-grade-assuntos,
    .agenda-grade-opcoes {
      display: grid;
      gap: .65rem;
    }

    .agenda-grade-horarios {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .agenda-grade-assuntos {
      grid-template-columns: 1fr;
      margin-bottom: 1.1rem;
    }

    .agenda-grade-opcoes {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin: .6rem 0 1rem;
    }

    .agenda-horario,
    .agenda-assunto,
    .agenda-opcao {
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 16px;
      padding: .9rem .85rem;
      background: var(--agenda-azul);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      transition: transform .2s ease, filter .2s ease, outline-color .2s ease;
    }

    .agenda-assunto,
    .agenda-opcao {
      text-align: left;
    }

    .agenda-horario:hover:not(:disabled),
    .agenda-assunto:hover:not(:disabled),
    .agenda-opcao:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .agenda-horario:disabled {
      background: var(--agenda-cinza-2);
      color: #71717a;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .agenda-horario.selecionado,
    .agenda-assunto.selecionado,
    .agenda-opcao.selecionado {
      outline: 3px solid var(--agenda-amarelo);
      outline-offset: 2px;
    }

    .agenda-campos {
      display: grid;
      gap: .9rem;
      margin-top: .9rem;
    }

    .agenda-campo label,
    .agenda-admin-campo label {
      display: block;
      margin-bottom: .35rem;
      color: var(--agenda-suave);
      font-weight: 900;
    }

    .agenda-campo input,
    .agenda-campo select,
    .agenda-campo textarea,
    .agenda-admin-campo input,
    .agenda-admin-campo select,
    .agenda-admin-campo textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--agenda-borda);
      border-radius: 16px;
      background: rgba(255, 255, 255, .07);
      color: #ffffff;
      padding: .95rem 1rem;
      font: inherit;
      outline: none;
    }

    .agenda-campo textarea,
    .agenda-admin-campo textarea {
      min-height: 88px;
      resize: vertical;
    }

    .agenda-campo input:focus,
    .agenda-campo select:focus,
    .agenda-campo textarea:focus,
    .agenda-admin-campo input:focus,
    .agenda-admin-campo select:focus,
    .agenda-admin-campo textarea:focus {
      border-color: rgba(37, 99, 235, .75);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .18);
    }

    .agenda-campo option,
    .agenda-admin-campo option {
      color: #111111;
      background: #ffffff;
    }

    .agenda-ajuda,
    .agenda-admin-ajuda {
      margin-top: .35rem;
      color: var(--agenda-mutado);
      font-size: .86rem;
      line-height: 1.45;
    }

    .agenda-aviso-uber {
      margin-top: .8rem;
      border: 1px solid rgba(250, 204, 21, .30);
      border-radius: 18px;
      background: rgba(250, 204, 21, .10);
      color: #fde68a;
      padding: .85rem 1rem;
      font-weight: 800;
      line-height: 1.45;
    }

    .agenda-popup-rodape {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: .7rem;
      padding: 1rem 1.2rem 1.2rem;
      border-top: 1px solid var(--agenda-borda);
      background: rgba(0, 0, 0, .20);
    }

    .agenda-botao {
      min-height: 46px;
      border: 1px solid transparent;
      border-radius: 15px;
      padding: .75rem .9rem;
      font-weight: 900;
      cursor: pointer;
      background: var(--agenda-cinza);
      color: #d4d4d8;
      transition: transform .2s ease, filter .2s ease, background .2s ease;
    }

    .agenda-botao[hidden] {
      display: none !important;
    }

    .agenda-botao:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.07);
    }

    .agenda-secundario {
      grid-column: 1;
      background: rgba(255, 255, 255, .08);
      color: #ffffff;
      border-color: var(--agenda-borda);
    }

    .agenda-confirmar {
      grid-column: 2;
      background: var(--agenda-verde);
      color: #ffffff;
    }

    .agenda-primario {
      grid-column: 3;
      background: var(--agenda-verde);
      color: #ffffff;
    }

    .agenda-confirmacao-card {
      display: grid;
      gap: .75rem;
      margin-top: 1rem;
      border: 1px solid var(--agenda-borda);
      border-radius: 20px;
      background: rgba(255, 255, 255, .06);
      padding: 1rem;
    }

    .agenda-confirmacao-linha {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: .8rem;
      align-items: start;
      padding-bottom: .75rem;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
    }

    .agenda-confirmacao-linha:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .agenda-confirmacao-label {
      color: var(--agenda-mutado);
      font-size: .9rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .agenda-confirmacao-valor {
      color: #ffffff;
      font-weight: 900;
      line-height: 1.35;
    }

    .agenda-confirmacao-aviso {
      margin-top: 1rem;
      border: 1px solid rgba(250, 204, 21, .28);
      border-radius: 18px;
      background: rgba(250, 204, 21, .10);
      color: #fde68a;
      padding: .9rem 1rem;
      font-weight: 800;
      line-height: 1.45;
    }

    /* Painel secreto */

    .agenda-admin-etiqueta {
      border: 1px solid rgba(250, 204, 21, .35);
      background: rgba(250, 204, 21, .12);
      color: #fef3c7;
    }

    .agenda-admin-layout {
      display: grid;
      grid-template-columns: minmax(280px, .9fr) minmax(320px, 1.1fr);
      gap: 1rem;
      align-items: start;
    }

    .agenda-admin-card {
      border: 1px solid var(--agenda-borda);
      border-radius: 22px;
      background: rgba(255, 255, 255, .045);
      padding: 1rem;
    }

    .agenda-admin-calendario-topo {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: .65rem;
      margin-bottom: .85rem;
    }

    .agenda-admin-calendario-topo h4,
    .agenda-admin-card h4 {
      margin: 0;
      text-align: center;
      text-transform: capitalize;
      font-size: 1.15rem;
    }

    .agenda-admin-nav,
    .agenda-admin-dia,
    .agenda-admin-horario,
    .agenda-admin-acao,
    .agenda-admin-confirmar,
    .agenda-admin-copiar,
    .agenda-admin-fechar-final,
    .agenda-admin-remover {
      border: 1px solid transparent;
      border-radius: 14px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s ease, filter .2s ease, background .2s ease;
    }

    .agenda-admin-nav {
      width: 42px;
      height: 42px;
      border-color: var(--agenda-borda);
      background: rgba(255, 255, 255, .07);
      color: #ffffff;
      font-size: 1.8rem;
      line-height: 1;
    }

    .agenda-admin-semana,
    .agenda-admin-dias {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: .4rem;
    }

    .agenda-admin-semana {
      margin-bottom: .45rem;
    }

    .agenda-admin-semana span {
      text-align: center;
      color: var(--agenda-mutado);
      font-size: .72rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .agenda-admin-dia {
      aspect-ratio: 1;
      background: var(--agenda-azul);
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .24);
    }

    .agenda-admin-dia.vazio {
      visibility: hidden;
      pointer-events: none;
    }

    .agenda-admin-dia:disabled {
      background: #18181b;
      color: #52525b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .agenda-admin-dia.parcial {
      background: #ca8a04;
      box-shadow: 0 8px 18px rgba(202, 138, 4, .20);
    }

    .agenda-admin-dia.indisponivel-total {
      background: var(--agenda-cinza-2);
      color: #a1a1aa;
      box-shadow: none;
    }

    .agenda-admin-dia.selecionado {
      outline: 3px solid var(--agenda-amarelo);
      outline-offset: 2px;
    }

    .agenda-admin-acoes-dia {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .65rem;
      margin: 1rem 0;
    }

    .agenda-admin-acao,
    .agenda-admin-confirmar,
    .agenda-admin-copiar,
    .agenda-admin-fechar-final,
    .agenda-admin-remover {
      min-height: 44px;
      padding: .75rem .9rem;
      color: #ffffff;
    }

    .agenda-admin-acao.disponivel {
      background: var(--agenda-verde);
    }

    .agenda-admin-acao.indisponivel {
      background: var(--agenda-cinza-2);
    }

    .agenda-admin-horarios {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .55rem;
    }

    .agenda-admin-horario {
      min-height: 42px;
      background: var(--agenda-azul);
      color: #ffffff;
    }

    .agenda-admin-horario.indisponivel {
      background: var(--agenda-cinza-2);
      color: #a1a1aa;
    }

    .agenda-admin-horario.selecionado {
      outline: 3px solid var(--agenda-amarelo);
      outline-offset: 2px;
    }

    .agenda-admin-vazio {
      margin: 1rem 0 0;
      color: var(--agenda-mutado);
      text-align: center;
      grid-column: 1 / -1;
    }

    .agenda-admin-editor {
      margin-top: 1rem;
      border: 1px solid var(--agenda-borda);
      border-radius: 20px;
      background: rgba(0, 0, 0, .22);
      padding: 1rem;
    }

    .agenda-admin-editor h5 {
      margin: 0 0 .75rem;
      font-size: 1rem;
    }

    .agenda-admin-campos {
      display: grid;
      gap: .8rem;
    }

    .agenda-admin-duas-colunas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .8rem;
    }

    .agenda-admin-remover {
      background: var(--agenda-vermelho);
      width: 100%;
      margin-top: .9rem;
    }

    .agenda-admin-gerar-wrap {
      display: flex;
      justify-content: center;
      margin: 1.2rem 0 0;
    }

    .agenda-admin-confirmar {
      background: var(--agenda-verde);
      min-width: min(340px, 100%);
    }

    .agenda-admin-codigo {
      margin-top: 1rem;
      border: 1px solid var(--agenda-borda);
      border-radius: 20px;
      background: rgba(0, 0, 0, .26);
      padding: 1rem;
    }

    .agenda-admin-codigo textarea {
      width: 100%;
      min-height: 240px;
      box-sizing: border-box;
      border: 1px solid var(--agenda-borda);
      border-radius: 16px;
      background: #09090b;
      color: #e5e7eb;
      padding: 1rem;
      font: 500 .86rem/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      resize: vertical;
      outline: none;
    }

    .agenda-admin-codigo-acoes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .7rem;
      margin-top: .9rem;
    }

    .agenda-admin-copiar {
      background: var(--agenda-azul);
    }

    .agenda-admin-fechar-final {
      background: rgba(255, 255, 255, .10);
      border-color: var(--agenda-borda);
    }

    .agenda-admin-feedback {
      margin-top: .7rem;
      min-height: 1.2rem;
      color: #bbf7d0;
      text-align: center;
      font-weight: 800;
    }

    .agenda-admin-nav:hover:not(:disabled),
    .agenda-admin-dia:hover:not(:disabled),
    .agenda-admin-horario:hover:not(:disabled),
    .agenda-admin-acao:hover:not(:disabled),
    .agenda-admin-confirmar:hover:not(:disabled),
    .agenda-admin-copiar:hover:not(:disabled),
    .agenda-admin-fechar-final:hover:not(:disabled),
    .agenda-admin-remover:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    @media (max-width: 860px) {
      .agenda-admin-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 580px) {
      .agenda-card,
      .agenda-popup,
      .agenda-admin-popup {
        border-radius: 22px;
      }

      .agenda-semana,
      .agenda-dias {
        gap: .38rem;
      }

      .agenda-dia {
        border-radius: 12px;
      }

      .agenda-popup-topo,
      .agenda-popup-corpo,
      .agenda-popup-rodape,
      .agenda-admin-topo,
      .agenda-admin-corpo {
        padding-left: .9rem;
        padding-right: .9rem;
      }

      .agenda-popup-rodape,
      .agenda-grade-opcoes,
      .agenda-admin-duas-colunas {
        grid-template-columns: 1fr;
      }

      .agenda-secundario,
      .agenda-confirmar,
      .agenda-primario {
        grid-column: auto;
      }

      .agenda-confirmacao-linha {
        grid-template-columns: 1fr;
        gap: .25rem;
      }
    }
  </style>
</head>

<body>
  <section class="agenda-cafematica" id="agenda" data-agenda-cafematica>
    <div class="agenda-shell">
      <div class="agenda-topo">
        <span class="agenda-etiqueta">Atendimento</span>
        <h1>Agende seu atendimento</h1>
        <p>Escolha uma data, um horário e envie sua solicitação pelo WhatsApp.</p>
      </div>

      <div class="agenda-card">
        <div class="agenda-calendario-cabecalho">
          <button class="agenda-nav" type="button" data-agenda-anterior aria-label="Mês anterior">‹</button>
          <h2 data-agenda-mes>Carregando...</h2>
          <button class="agenda-nav" type="button" data-agenda-proximo aria-label="Próximo mês">›</button>
        </div>

        <div class="agenda-semana">
          <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>

        <div class="agenda-dias" data-agenda-dias></div>
      </div>
    </div>

    <div class="agenda-modal" data-agenda-modal hidden>
      <div class="agenda-modal-fundo" data-agenda-fechar></div>

      <div class="agenda-popup" role="dialog" aria-modal="true" aria-labelledby="agendaTituloPopup">
        <div class="agenda-popup-topo">
          <div>
            <span class="agenda-popup-etapa" data-agenda-etapa>Etapa 1 de 3</span>
            <h3 id="agendaTituloPopup">Agendamento</h3>
            <p data-agenda-resumo></p>
          </div>

          <button class="agenda-fechar" type="button" data-agenda-fechar aria-label="Fechar">×</button>
        </div>

        <div class="agenda-progresso">
          <span data-agenda-bolinha="0"></span>
          <span data-agenda-bolinha="1"></span>
          <span data-agenda-bolinha="2"></span>
        </div>

        <div class="agenda-aviso" data-agenda-aviso></div>
        <div class="agenda-popup-corpo" data-agenda-corpo></div>

        <div class="agenda-popup-rodape">
          <button class="agenda-botao agenda-secundario" type="button" data-agenda-voltar hidden>Voltar</button>
          <button class="agenda-botao agenda-confirmar" type="button" data-agenda-confirmar hidden>Confirmar</button>
          <button class="agenda-botao agenda-primario" type="button" data-agenda-avancar hidden>Avançar</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    (function () {
      document.title = "Agendar";

      const WHATSAPP_DESTINO = "5567999975834";
      const ENDERECO_PROFESSOR = "Rua João Leite Ribeiro, 1296, esquina com a Rua Bahia";

      const ASSUNTOS_PREDEFINIDOS = [
        "Aula particular de Matemática",
        "Matemática Básica",
        "Matemática para Concursos",
        "Matemática para o ENEM",
        "Consultoria em LaTeX",
        "Tecnologia e informática",
        "Outro, não está entre os listados"
      ];

      // =========================================================
      // INÍCIO DAS INDISPONIBILIDADES MANUAIS
      // Substitua todo este bloco pelo código gerado no painel secreto.
      const HORARIOS_INDISPONIVEIS = {
        // Exemplo com estudante:
        // "2026-05-30": {
        //   "09:00": {
        //     "tipo": "estudante",
        //     "nome": "Nome da pessoa",
        //     "telefone": "(67) 99999-9999",
        //     "assunto": "Matemática Básica",
        //     "modalidade": "online"
        //   }
        // },
        // Exemplo com SENAR:
        // "2026-06-01": {
        //   "14:00": {
        //     "tipo": "senar",
        //     "local": "Local do atendimento",
        //     "assunto": "Assunto do atendimento"
        //   }
        // }
      };
      let indisponibilidadesEditaveis = {};
      // FIM DAS INDISPONIBILIDADES MANUAIS

      const agenda = document.querySelector("[data-agenda-cafematica]");
      if (!agenda) return;

      const elMes = agenda.querySelector("[data-agenda-mes]");
      const elDias = agenda.querySelector("[data-agenda-dias]");
      const btnAnterior = agenda.querySelector("[data-agenda-anterior]");
      const btnProximo = agenda.querySelector("[data-agenda-proximo]");
      const modal = agenda.querySelector("[data-agenda-modal]");
      const modalFechar = agenda.querySelectorAll("[data-agenda-fechar]");
      const elEtapa = agenda.querySelector("[data-agenda-etapa]");
      const elResumo = agenda.querySelector("[data-agenda-resumo]");
      const elAviso = agenda.querySelector("[data-agenda-aviso]");
      const elCorpo = agenda.querySelector("[data-agenda-corpo]");
      const btnVoltar = agenda.querySelector("[data-agenda-voltar]");
      const btnConfirmar = agenda.querySelector("[data-agenda-confirmar]");
      const btnAvancar = agenda.querySelector("[data-agenda-avancar]");
      const bolinhas = agenda.querySelectorAll("[data-agenda-bolinha]");

      const hojeIso = obterHojeBrasiliaIso();
      const [anoHoje, mesHoje] = hojeIso.split("-").map(Number);
      let anoAtual = anoHoje;
      let mesAtual = mesHoje - 1;

      const estado = {
        etapa: 0,
        data: "",
        horario: "",
        assunto: "",
        modalidadeAtendimento: "",
        localPresencial: "",
        cidadeCliente: "",
        enderecoCliente: ""
      };

      indisponibilidadesEditaveis = normalizarIndisponibilidades(HORARIOS_INDISPONIVEIS);

      function escaparHtml(valor) {
        return String(valor || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function obterHojeBrasiliaIso() {
        const partes = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Sao_Paulo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());

        const mapa = {};
        partes.forEach((parte) => { mapa[parte.type] = parte.value; });
        return `${mapa.year}-${mapa.month}-${mapa.day}`;
      }

      function criarDataBrasilia(dataIso, horario) {
        return new Date(`${dataIso}T${horario}:00-03:00`);
      }

      function horarioBloqueadoPorAntecedencia(dataIso, horario) {
        const oitoHorasEmMs = 8 * 60 * 60 * 1000;
        const limiteMinimo = new Date(Date.now() + oitoHorasEmMs);
        const dataHorarioEscolhido = criarDataBrasilia(dataIso, horario);
        return dataHorarioEscolhido.getTime() < limiteMinimo.getTime();
      }

      function criarIso(ano, mesZero, dia) {
        const mes = String(mesZero + 1).padStart(2, "0");
        const diaFormatado = String(dia).padStart(2, "0");
        return `${ano}-${mes}-${diaFormatado}`;
      }

      function formatarDataBR(iso) {
        const [ano, mes, dia] = iso.split("-");
        return `${dia}/${mes}/${ano}`;
      }

      function nomeDoMes(ano, mesZero) {
        const data = new Date(ano, mesZero, 1, 12);
        return new Intl.DateTimeFormat("pt-BR", { month: "long", year: "numeric" }).format(data);
      }

      function gerarHorarios() {
        const horarios = [];
        for (let hora = 7; hora <= 22; hora++) {
          horarios.push(`${String(hora).padStart(2, "0")}:00`);
        }
        return horarios;
      }

      function criarRegistroPadrao() {
        return { tipo: "bloqueio", observacao: "Indisponível manualmente" };
      }

      function limparRegistro(registro) {
        const r = registro && typeof registro === "object" ? { ...registro } : criarRegistroPadrao();
        r.tipo = ["bloqueio", "estudante", "senar"].includes(r.tipo) ? r.tipo : "bloqueio";

        if (r.tipo === "estudante") {
          return {
            tipo: "estudante",
            nome: r.nome || "",
            telefone: r.telefone || "",
            assunto: r.assunto || "",
            modalidade: ["online", "presencial"].includes(r.modalidade) ? r.modalidade : "online",
            localPresencial: r.localPresencial || "",
            endereco: r.endereco || ""
          };
        }

        if (r.tipo === "senar") {
          return {
            tipo: "senar",
            local: r.local || "",
            assunto: r.assunto || ""
          };
        }

        return {
          tipo: "bloqueio",
          observacao: r.observacao || "Indisponível manualmente"
        };
      }

      function normalizarIndisponibilidades(origem) {
        const saida = {};
        const horariosValidos = gerarHorarios();

        Object.keys(origem || {}).forEach((dataIso) => {
          const valor = origem[dataIso];
          saida[dataIso] = {};

          if (Array.isArray(valor)) {
            const horas = valor.includes("DIA_TODO") ? horariosValidos : valor;
            horas.forEach((horario) => {
              if (horariosValidos.includes(horario)) {
                saida[dataIso][horario] = criarRegistroPadrao();
              }
            });
          } else if (valor && typeof valor === "object") {
            Object.keys(valor).forEach((horario) => {
              if (horariosValidos.includes(horario)) {
                saida[dataIso][horario] = limparRegistro(valor[horario]);
              }
            });
          }

          if (Object.keys(saida[dataIso]).length === 0) {
            delete saida[dataIso];
          }
        });

        return saida;
      }

      function obterRegistrosDoDia(dataIso) {
        return indisponibilidadesEditaveis[dataIso] || {};
      }

      function obterRegistroIndisponibilidade(dataIso, horario) {
        return obterRegistrosDoDia(dataIso)[horario] || null;
      }

      function definirRegistroIndisponibilidade(dataIso, horario, registro) {
        if (!indisponibilidadesEditaveis[dataIso]) {
          indisponibilidadesEditaveis[dataIso] = {};
        }
        indisponibilidadesEditaveis[dataIso][horario] = limparRegistro(registro);
      }

      function removerRegistroIndisponibilidade(dataIso, horario) {
        if (!indisponibilidadesEditaveis[dataIso]) return;
        delete indisponibilidadesEditaveis[dataIso][horario];
        if (Object.keys(indisponibilidadesEditaveis[dataIso]).length === 0) {
          delete indisponibilidadesEditaveis[dataIso];
        }
      }

      function definirDiaTodo(dataIso) {
        indisponibilidadesEditaveis[dataIso] = {};
        gerarHorarios().forEach((horario) => {
          indisponibilidadesEditaveis[dataIso][horario] = criarRegistroPadrao();
        });
      }

      function limparDia(dataIso) {
        delete indisponibilidadesEditaveis[dataIso];
      }

      function obterHorariosManuais(dataIso) {
        const registros = obterRegistrosDoDia(dataIso);
        const ordem = gerarHorarios();
        return Object.keys(registros).filter((h) => ordem.includes(h)).sort((a, b) => ordem.indexOf(a) - ordem.indexOf(b));
      }

      function horarioIndisponivel(dataIso, horario) {
        const indisponivelManual = Boolean(obterRegistroIndisponibilidade(dataIso, horario));
        const indisponivelPelaAntecedencia = horarioBloqueadoPorAntecedencia(dataIso, horario);
        return indisponivelManual || indisponivelPelaAntecedencia;
      }

      function diaTemAlgumHorarioPermitido(dataIso) {
        return gerarHorarios().some((horario) => !horarioIndisponivel(dataIso, horario));
      }

      function montarResumoRegistro(registro) {
        if (!registro) return "";

        if (registro.tipo === "estudante") {
          const partes = ["Estudante"];
          if (registro.nome) partes.push(`Nome: ${registro.nome}`);
          if (registro.telefone) partes.push(`Telefone: ${registro.telefone}`);
          if (registro.assunto) partes.push(`Assunto: ${registro.assunto}`);
          partes.push(`Atendimento: ${registro.modalidade === "presencial" ? "Presencial" : "Online"}`);
          if (registro.modalidade === "presencial" && registro.localPresencial) partes.push(`Local: ${registro.localPresencial}`);
          if (registro.endereco) partes.push(`Endereço: ${registro.endereco}`);
          return partes.join("\n");
        }

        if (registro.tipo === "senar") {
          const partes = ["SENAR"];
          if (registro.local) partes.push(`Onde atendo: ${registro.local}`);
          if (registro.assunto) partes.push(`Assunto: ${registro.assunto}`);
          return partes.join("\n");
        }

        return registro.observacao || "Indisponível manualmente";
      }

      function montarResumoDia(dataIso) {
        const horarios = obterHorariosManuais(dataIso);
        if (horarios.length === 0) return "Sem indisponibilidades manuais.";

        return horarios.map((horario) => {
          const registro = obterRegistroIndisponibilidade(dataIso, horario);
          const primeiraLinha = montarResumoRegistro(registro).split("\n")[0];
          return `${horario} — ${primeiraLinha}`;
        }).join("\n");
      }

      function renderizarCalendario() {
        elMes.textContent = nomeDoMes(anoAtual, mesAtual);
        elDias.innerHTML = "";

        const primeiroDiaSemana = new Date(anoAtual, mesAtual, 1).getDay();
        const totalDias = new Date(anoAtual, mesAtual + 1, 0).getDate();

        for (let i = 0; i < primeiroDiaSemana; i++) {
          const vazio = document.createElement("span");
          vazio.className = "agenda-dia vazio";
          elDias.appendChild(vazio);
        }

        for (let dia = 1; dia <= totalDias; dia++) {
          const dataIso = criarIso(anoAtual, mesAtual, dia);
          const bloqueado = dataIso < hojeIso || !diaTemAlgumHorarioPermitido(dataIso);

          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-dia";
          botao.textContent = dia;

          if (dataIso === hojeIso) botao.classList.add("hoje");

          if (bloqueado) {
            botao.disabled = true;
            botao.setAttribute("aria-label", `${formatarDataBR(dataIso)} indisponível`);
            botao.title = "Esta data não possui horários disponíveis.";
          } else {
            botao.setAttribute("aria-label", `Agendar em ${formatarDataBR(dataIso)}`);
            botao.addEventListener("click", () => abrirModal(dataIso));
          }

          elDias.appendChild(botao);
        }

        btnAnterior.disabled = anoAtual < anoHoje || (anoAtual === anoHoje && mesAtual <= mesHoje - 1);
      }

      function abrirModal(dataIso) {
        estado.etapa = 0;
        estado.data = dataIso;
        estado.horario = "";
        estado.assunto = "";
        estado.modalidadeAtendimento = "";
        estado.localPresencial = "";
        estado.cidadeCliente = "";
        estado.enderecoCliente = "";

        modal.hidden = false;
        document.body.classList.add("agenda-modal-aberto");
        renderizarPopup();
      }

      function fecharModal() {
        modal.hidden = true;
        document.body.classList.remove("agenda-modal-aberto");
      }

      function renderizarPopup() {
        elEtapa.textContent = `Etapa ${estado.etapa + 1} de 3`;
        elResumo.textContent = `Data escolhida: ${formatarDataBR(estado.data)}`;
        bolinhas.forEach((bolinha, indice) => bolinha.classList.toggle("ativo", indice <= estado.etapa));
        elAviso.textContent = "";

        if (estado.etapa === 0) renderizarEtapaHorarios();
        if (estado.etapa === 1) renderizarEtapaAssuntoAtendimento();
        if (estado.etapa === 2) renderizarEtapaConfirmacao();

        atualizarBotoes();
      }

      function renderizarEtapaHorarios() {
        elCorpo.innerHTML = `
          <h4>Escolha o horário de início</h4>
          <p>Horários disponíveis das 7h00 às 22h00, pelo horário de Brasília. Só é possível agendar com pelo menos 8 horas de antecedência.</p>
          <div class="agenda-grade-horarios"></div>
        `;

        const grade = elCorpo.querySelector(".agenda-grade-horarios");
        gerarHorarios().forEach((horario) => {
          const registro = obterRegistroIndisponibilidade(estado.data, horario);
          const indisponivel = horarioIndisponivel(estado.data, horario);
          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-horario";
          botao.textContent = horario;
          botao.disabled = indisponivel;

          if (estado.horario === horario) botao.classList.add("selecionado");

          if (indisponivel) {
            botao.title = registro ? "Este horário está indisponível." : "Este horário não respeita a antecedência mínima de 8 horas.";
          } else {
            botao.addEventListener("click", () => {
              estado.horario = horario;
              renderizarPopup();
            });
          }

          grade.appendChild(botao);
        });
      }

      function renderizarEtapaAssuntoAtendimento() {
        const assuntoHtml = ASSUNTOS_PREDEFINIDOS.map((assunto) => `
          <button class="agenda-assunto ${estado.assunto === assunto ? "selecionado" : ""}" type="button" data-assunto="${escaparHtml(assunto)}">
            ${escaparHtml(assunto)}
          </button>
        `).join("");

        elCorpo.innerHTML = `
          <h4>Assunto e forma de atendimento</h4>
          <p>Escolha o assunto e diga se o atendimento será online ou presencial.</p>

          <div class="agenda-grade-assuntos">${assuntoHtml}</div>

          <h4>Como você quer ser atendido?</h4>
          <div class="agenda-grade-opcoes">
            <button class="agenda-opcao ${estado.modalidadeAtendimento === "online" ? "selecionado" : ""}" type="button" data-modalidade="online">Online</button>
            <button class="agenda-opcao ${estado.modalidadeAtendimento === "presencial" ? "selecionado" : ""}" type="button" data-modalidade="presencial">Presencial</button>
          </div>

          <div data-opcoes-presenciais></div>
        `;

        elCorpo.querySelectorAll("[data-assunto]").forEach((botao) => {
          botao.addEventListener("click", () => {
            estado.assunto = botao.dataset.assunto;
            renderizarPopup();
          });
        });

        elCorpo.querySelectorAll("[data-modalidade]").forEach((botao) => {
          botao.addEventListener("click", () => {
            estado.modalidadeAtendimento = botao.dataset.modalidade;
            if (estado.modalidadeAtendimento === "online") {
              estado.localPresencial = "";
              estado.cidadeCliente = "";
              estado.enderecoCliente = "";
            }
            renderizarPopup();
          });
        });

        renderizarOpcoesPresenciais();
      }

      function renderizarOpcoesPresenciais() {
        const container = elCorpo.querySelector("[data-opcoes-presenciais]");
        if (!container) return;

        if (estado.modalidadeAtendimento !== "presencial") {
          container.innerHTML = "";
          return;
        }

        container.innerHTML = `
          <h4>Onde será o atendimento presencial?</h4>
          <div class="agenda-grade-opcoes">
            <button class="agenda-opcao ${estado.localPresencial === "professor" ? "selecionado" : ""}" type="button" data-local-presencial="professor">
              Na casa do Prof. Fernando<br><small>${ENDERECO_PROFESSOR}</small>
            </button>
            <button class="agenda-opcao ${estado.localPresencial === "cliente" ? "selecionado" : ""}" type="button" data-local-presencial="cliente">
              Na casa da pessoa<br><small>Aquidauana ou Anastácio</small>
            </button>
          </div>

          <div data-endereco-cliente></div>
        `;

        container.querySelectorAll("[data-local-presencial]").forEach((botao) => {
          botao.addEventListener("click", () => {
            estado.localPresencial = botao.dataset.localPresencial;
            if (estado.localPresencial !== "cliente") {
              estado.cidadeCliente = "";
              estado.enderecoCliente = "";
            }
            renderizarPopup();
          });
        });

        renderizarEnderecoCliente();
      }

      function renderizarEnderecoCliente() {
        const container = elCorpo.querySelector("[data-endereco-cliente]");
        if (!container) return;

        if (estado.localPresencial !== "cliente") {
          container.innerHTML = "";
          return;
        }

        container.innerHTML = `
          <div class="agenda-campos">
            <div class="agenda-campo">
              <label for="agendaCidadeCliente">Cidade</label>
              <select id="agendaCidadeCliente">
                <option value="">Escolha a cidade</option>
                <option value="Aquidauana" ${estado.cidadeCliente === "Aquidauana" ? "selected" : ""}>Aquidauana</option>
                <option value="Anastácio" ${estado.cidadeCliente === "Anastácio" ? "selected" : ""}>Anastácio</option>
              </select>
            </div>

            <div class="agenda-campo">
              <label for="agendaEnderecoCliente">Endereço</label>
              <input id="agendaEnderecoCliente" type="text" placeholder="Nome da rua e número da casa" value="${escaparHtml(estado.enderecoCliente)}">
            </div>
          </div>

          <div class="agenda-aviso-uber">
            Para atendimento na casa da pessoa, há acréscimo da taxa de Uber.
          </div>
        `;

        container.querySelector("#agendaCidadeCliente").addEventListener("change", (evento) => {
          estado.cidadeCliente = evento.target.value;
          atualizarBotoes();
        });

        container.querySelector("#agendaEnderecoCliente").addEventListener("input", (evento) => {
          estado.enderecoCliente = evento.target.value;
          atualizarBotoes();
        });
      }

      function textoModalidadePublica() {
        if (estado.modalidadeAtendimento === "online") return "Online";

        if (estado.modalidadeAtendimento === "presencial" && estado.localPresencial === "professor") {
          return `Presencial — na casa do Prof. Fernando (${ENDERECO_PROFESSOR})`;
        }

        if (estado.modalidadeAtendimento === "presencial" && estado.localPresencial === "cliente") {
          return `Presencial — na casa da pessoa, em ${estado.cidadeCliente}, ${estado.enderecoCliente}. Há taxa de Uber.`;
        }

        return "Não informado";
      }

      function renderizarEtapaConfirmacao() {
        elCorpo.innerHTML = `
          <h4>Confirme seu agendamento</h4>
          <p>Confira os dados antes de continuar.</p>

          <div class="agenda-confirmacao-card">
            <div class="agenda-confirmacao-linha">
              <span class="agenda-confirmacao-label">Data</span>
              <span class="agenda-confirmacao-valor">${formatarDataBR(estado.data)}</span>
            </div>
            <div class="agenda-confirmacao-linha">
              <span class="agenda-confirmacao-label">Horário</span>
              <span class="agenda-confirmacao-valor">${estado.horario} (horário de Brasília)</span>
            </div>
            <div class="agenda-confirmacao-linha">
              <span class="agenda-confirmacao-label">Assunto</span>
              <span class="agenda-confirmacao-valor">${escaparHtml(estado.assunto)}</span>
            </div>
            <div class="agenda-confirmacao-linha">
              <span class="agenda-confirmacao-label">Atendimento</span>
              <span class="agenda-confirmacao-valor">${escaparHtml(textoModalidadePublica())}</span>
            </div>
          </div>

          <div class="agenda-confirmacao-aviso">
            Ao clicar em Confirmar, você será encaminhado para o WhatsApp para enviar a mensagem e concluir a solicitação do agendamento.
          </div>
        `;
      }

      function podeAvancar() {
        if (estado.etapa === 0) return Boolean(estado.horario);

        if (estado.etapa === 1) {
          if (!estado.assunto || !estado.modalidadeAtendimento) return false;

          if (estado.modalidadeAtendimento === "presencial") {
            if (!estado.localPresencial) return false;
            if (estado.localPresencial === "cliente") {
              return Boolean(estado.cidadeCliente && estado.enderecoCliente.trim().length >= 5);
            }
          }

          return true;
        }

        return false;
      }

      function podeConfirmar() {
        const dadosBasicosOk = Boolean(estado.data && estado.horario && estado.assunto && estado.modalidadeAtendimento);
        const indisponivel = horarioIndisponivel(estado.data, estado.horario);
        elAviso.textContent = estado.etapa === 2 && indisponivel ? "Este horário está indisponível." : "";
        return dadosBasicosOk && !indisponivel;
      }

      function definirVisibilidadeBotao(botao, visivel, ativo) {
        botao.hidden = !visivel;
        botao.disabled = !visivel || !ativo;
      }

      function atualizarBotoes() {
        const voltarVisivel = estado.etapa > 0;
        const avancarVisivel = estado.etapa < 2 && podeAvancar();
        const confirmarVisivel = estado.etapa === 2 && podeConfirmar();
        definirVisibilidadeBotao(btnVoltar, voltarVisivel, voltarVisivel);
        definirVisibilidadeBotao(btnAvancar, avancarVisivel, avancarVisivel);
        definirVisibilidadeBotao(btnConfirmar, confirmarVisivel, confirmarVisivel);
      }

      function enviarWhatsApp() {
        if (!podeConfirmar()) return;

        const mensagem = [
          "Olá, Fernando! Gostaria de confirmar uma solicitação de agendamento.",
          "",
          `Data: ${formatarDataBR(estado.data)}`,
          `Horário: ${estado.horario} (horário de Brasília)`,
          `Assunto: ${estado.assunto}`,
          `Atendimento: ${textoModalidadePublica()}`
        ].join("\n");

        const url = `https://wa.me/${WHATSAPP_DESTINO}?text=${encodeURIComponent(mensagem)}`;
        window.open(url, "_blank", "noopener,noreferrer");
      }

      // =========================================================
      // Painel secreto de indisponibilidades
      // =========================================================

      let adminModal = null;
      let adminAnoAtual = anoHoje;
      let adminMesAtual = mesHoje - 1;
      let adminDataSelecionada = "";
      let adminHorarioSelecionado = "";

      function criarPainelAdmin() {
        adminModal = document.createElement("div");
        adminModal.className = "agenda-admin-modal";
        adminModal.hidden = true;
        adminModal.innerHTML = `
          <div class="agenda-admin-fundo" data-admin-fechar></div>
          <div class="agenda-admin-popup" role="dialog" aria-modal="true" aria-labelledby="agendaAdminTitulo">
            <div class="agenda-admin-topo">
              <div>
                <span class="agenda-admin-etiqueta">Painel secreto</span>
                <h3 id="agendaAdminTitulo">Indisponibilidades da agenda</h3>
                <p>Cadastre horários, identifique SENAR ou estudante e gere o código para substituir no HTML.</p>
              </div>
              <button class="agenda-admin-fechar" type="button" data-admin-fechar aria-label="Fechar">×</button>
            </div>

            <div class="agenda-admin-corpo">
              <div class="agenda-admin-layout">
                <div class="agenda-admin-card">
                  <div class="agenda-admin-calendario-topo">
                    <button class="agenda-admin-nav" type="button" data-admin-mes-anterior aria-label="Mês anterior">‹</button>
                    <h4 data-admin-mes>Carregando...</h4>
                    <button class="agenda-admin-nav" type="button" data-admin-mes-proximo aria-label="Próximo mês">›</button>
                  </div>

                  <div class="agenda-admin-semana">
                    <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
                  </div>

                  <div class="agenda-admin-dias" data-admin-dias></div>
                  <p class="agenda-admin-ajuda">Azul: livre. Amarelo: parcialmente bloqueado. Cinza: dia todo bloqueado. Passe o mouse para ver os detalhes salvos.</p>
                </div>

                <div class="agenda-admin-card">
                  <h4 data-admin-data-titulo>Escolha um dia no calendário</h4>

                  <div class="agenda-admin-acoes-dia">
                    <button class="agenda-admin-acao disponivel" type="button" data-admin-tudo-disponivel>Tudo disponível</button>
                    <button class="agenda-admin-acao indisponivel" type="button" data-admin-tudo-indisponivel>Tudo indisponível</button>
                  </div>

                  <div class="agenda-admin-horarios" data-admin-horarios>
                    <p class="agenda-admin-vazio">Clique em uma data para editar os horários.</p>
                  </div>

                  <div class="agenda-admin-editor" data-admin-editor hidden></div>
                </div>
              </div>

              <div class="agenda-admin-gerar-wrap">
                <button class="agenda-admin-confirmar" type="button" data-admin-gerar-codigo>Confirmar indisponibilidades</button>
              </div>

              <div class="agenda-admin-codigo" data-admin-codigo-wrap hidden>
                <textarea data-admin-codigo readonly></textarea>
                <div class="agenda-admin-codigo-acoes">
                  <button class="agenda-admin-copiar" type="button" data-admin-copiar>Copiar código</button>
                  <button class="agenda-admin-fechar-final" type="button" data-admin-confirmar-final>Confirmar e fechar</button>
                </div>
                <div class="agenda-admin-feedback" data-admin-feedback></div>
              </div>
            </div>
          </div>
        `;

        document.body.appendChild(adminModal);

        adminModal.querySelectorAll("[data-admin-fechar]").forEach((botao) => botao.addEventListener("click", fecharPainelAdmin));

        adminModal.querySelector("[data-admin-mes-anterior]").addEventListener("click", () => {
          adminMesAtual--;
          if (adminMesAtual < 0) { adminMesAtual = 11; adminAnoAtual--; }
          adminHorarioSelecionado = "";
          renderizarPainelAdmin();
        });

        adminModal.querySelector("[data-admin-mes-proximo]").addEventListener("click", () => {
          adminMesAtual++;
          if (adminMesAtual > 11) { adminMesAtual = 0; adminAnoAtual++; }
          adminHorarioSelecionado = "";
          renderizarPainelAdmin();
        });

        adminModal.querySelector("[data-admin-tudo-disponivel]").addEventListener("click", () => {
          if (!adminDataSelecionada) return;
          limparDia(adminDataSelecionada);
          adminHorarioSelecionado = "";
          limparCodigoAdminGerado();
          renderizarPainelAdmin();
          renderizarCalendario();
        });

        adminModal.querySelector("[data-admin-tudo-indisponivel]").addEventListener("click", () => {
          if (!adminDataSelecionada) return;
          definirDiaTodo(adminDataSelecionada);
          adminHorarioSelecionado = gerarHorarios()[0];
          limparCodigoAdminGerado();
          renderizarPainelAdmin();
          renderizarCalendario();
        });

        adminModal.querySelector("[data-admin-gerar-codigo]").addEventListener("click", gerarCodigoAdmin);
        adminModal.querySelector("[data-admin-copiar]").addEventListener("click", copiarCodigoAdmin);
        adminModal.querySelector("[data-admin-confirmar-final]").addEventListener("click", fecharPainelAdmin);
      }

      function abrirPainelAdmin() {
        if (!adminModal) return;
        adminAnoAtual = anoHoje;
        adminMesAtual = mesHoje - 1;
        adminDataSelecionada = "";
        adminHorarioSelecionado = "";
        adminModal.hidden = false;
        document.body.classList.add("agenda-admin-aberto");
        limparCodigoAdminGerado();
        renderizarPainelAdmin();
      }

      function fecharPainelAdmin() {
        if (!adminModal) return;
        adminModal.hidden = true;
        document.body.classList.remove("agenda-admin-aberto");
      }

      function renderizarPainelAdmin() {
        if (!adminModal) return;

        const elAdminMes = adminModal.querySelector("[data-admin-mes]");
        const elAdminDias = adminModal.querySelector("[data-admin-dias]");
        const btnAdminAnterior = adminModal.querySelector("[data-admin-mes-anterior]");
        elAdminMes.textContent = nomeDoMes(adminAnoAtual, adminMesAtual);
        elAdminDias.innerHTML = "";

        const primeiroDiaSemana = new Date(adminAnoAtual, adminMesAtual, 1).getDay();
        const totalDias = new Date(adminAnoAtual, adminMesAtual + 1, 0).getDate();

        for (let i = 0; i < primeiroDiaSemana; i++) {
          const vazio = document.createElement("span");
          vazio.className = "agenda-admin-dia vazio";
          elAdminDias.appendChild(vazio);
        }

        for (let dia = 1; dia <= totalDias; dia++) {
          const dataIso = criarIso(adminAnoAtual, adminMesAtual, dia);
          const horariosManuais = obterHorariosManuais(dataIso);
          const totalHorarios = gerarHorarios().length;
          const passado = dataIso < hojeIso;

          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-admin-dia";
          botao.textContent = dia;
          botao.title = montarResumoDia(dataIso);

          if (horariosManuais.length > 0 && horariosManuais.length < totalHorarios) botao.classList.add("parcial");
          if (horariosManuais.length === totalHorarios) botao.classList.add("indisponivel-total");
          if (dataIso === adminDataSelecionada) botao.classList.add("selecionado");

          if (passado) {
            botao.disabled = true;
          } else {
            botao.addEventListener("click", () => {
              adminDataSelecionada = dataIso;
              adminHorarioSelecionado = "";
              limparCodigoAdminGerado();
              renderizarPainelAdmin();
            });
          }

          elAdminDias.appendChild(botao);
        }

        btnAdminAnterior.disabled = adminAnoAtual < anoHoje || (adminAnoAtual === anoHoje && adminMesAtual <= mesHoje - 1);
        renderizarHorariosAdmin();
      }

      function renderizarHorariosAdmin() {
        const titulo = adminModal.querySelector("[data-admin-data-titulo]");
        const grade = adminModal.querySelector("[data-admin-horarios]");
        const editor = adminModal.querySelector("[data-admin-editor]");
        const btnTudoDisponivel = adminModal.querySelector("[data-admin-tudo-disponivel]");
        const btnTudoIndisponivel = adminModal.querySelector("[data-admin-tudo-indisponivel]");

        grade.innerHTML = "";
        editor.hidden = true;
        editor.innerHTML = "";
        btnTudoDisponivel.disabled = !adminDataSelecionada;
        btnTudoIndisponivel.disabled = !adminDataSelecionada;

        if (!adminDataSelecionada) {
          titulo.textContent = "Escolha um dia no calendário";
          grade.innerHTML = `<p class="agenda-admin-vazio">Clique em uma data para editar os horários.</p>`;
          return;
        }

        titulo.textContent = `Horários de ${formatarDataBR(adminDataSelecionada)}`;

        gerarHorarios().forEach((horario) => {
          const registro = obterRegistroIndisponibilidade(adminDataSelecionada, horario);
          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "agenda-admin-horario";
          botao.textContent = horario;
          botao.title = registro ? montarResumoRegistro(registro) : "Disponível. Clique para tornar indisponível.";

          if (registro) botao.classList.add("indisponivel");
          if (adminHorarioSelecionado === horario) botao.classList.add("selecionado");

          botao.addEventListener("click", () => {
            if (!obterRegistroIndisponibilidade(adminDataSelecionada, horario)) {
              definirRegistroIndisponibilidade(adminDataSelecionada, horario, criarRegistroPadrao());
            }
            adminHorarioSelecionado = horario;
            limparCodigoAdminGerado();
            renderizarPainelAdmin();
            renderizarCalendario();
          });

          grade.appendChild(botao);
        });

        renderizarEditorAdmin();
      }

      function renderizarEditorAdmin() {
        const editor = adminModal.querySelector("[data-admin-editor]");
        if (!adminDataSelecionada || !adminHorarioSelecionado) return;

        const registro = obterRegistroIndisponibilidade(adminDataSelecionada, adminHorarioSelecionado);
        if (!registro) return;

        editor.hidden = false;

        const tipo = registro.tipo || "bloqueio";
        let camposEspecificos = "";

        if (tipo === "estudante") {
          camposEspecificos = `
            <div class="agenda-admin-duas-colunas">
              <div class="agenda-admin-campo">
                <label>Nome</label>
                <input data-admin-campo="nome" type="text" value="${escaparHtml(registro.nome)}" placeholder="Nome do estudante">
              </div>
              <div class="agenda-admin-campo">
                <label>Telefone</label>
                <input data-admin-campo="telefone" type="text" value="${escaparHtml(registro.telefone)}" placeholder="Telefone/WhatsApp">
              </div>
            </div>
            <div class="agenda-admin-campo">
              <label>Assunto</label>
              <input data-admin-campo="assunto" type="text" value="${escaparHtml(registro.assunto)}" placeholder="Assunto da aula">
            </div>
            <div class="agenda-admin-duas-colunas">
              <div class="agenda-admin-campo">
                <label>Presencial ou online?</label>
                <select data-admin-campo="modalidade">
                  <option value="online" ${registro.modalidade === "online" ? "selected" : ""}>Online</option>
                  <option value="presencial" ${registro.modalidade === "presencial" ? "selected" : ""}>Presencial</option>
                </select>
              </div>
              <div class="agenda-admin-campo">
                <label>Local, se presencial</label>
                <input data-admin-campo="localPresencial" type="text" value="${escaparHtml(registro.localPresencial)}" placeholder="Ex.: Minha casa, casa da pessoa">
              </div>
            </div>
            <div class="agenda-admin-campo">
              <label>Endereço/observação de local</label>
              <input data-admin-campo="endereco" type="text" value="${escaparHtml(registro.endereco)}" placeholder="Opcional">
            </div>
          `;
        } else if (tipo === "senar") {
          camposEspecificos = `
            <div class="agenda-admin-campo">
              <label>Onde atendo</label>
              <input data-admin-campo="local" type="text" value="${escaparHtml(registro.local)}" placeholder="Local do atendimento SENAR">
            </div>
            <div class="agenda-admin-campo">
              <label>Assunto</label>
              <input data-admin-campo="assunto" type="text" value="${escaparHtml(registro.assunto)}" placeholder="Assunto do SENAR">
            </div>
          `;
        } else {
          camposEspecificos = `
            <div class="agenda-admin-campo">
              <label>Observação</label>
              <input data-admin-campo="observacao" type="text" value="${escaparHtml(registro.observacao)}" placeholder="Ex.: compromisso pessoal, viagem, descanso">
            </div>
          `;
        }

        editor.innerHTML = `
          <h5>${formatarDataBR(adminDataSelecionada)} — ${adminHorarioSelecionado}</h5>
          <div class="agenda-admin-campos">
            <div class="agenda-admin-campo">
              <label>Tipo de indisponibilidade</label>
              <select data-admin-campo="tipo">
                <option value="bloqueio" ${tipo === "bloqueio" ? "selected" : ""}>Bloqueio simples</option>
                <option value="estudante" ${tipo === "estudante" ? "selected" : ""}>Estudante</option>
                <option value="senar" ${tipo === "senar" ? "selected" : ""}>SENAR</option>
              </select>
            </div>
            ${camposEspecificos}
          </div>
          <button class="agenda-admin-remover" type="button" data-admin-remover-horario>Tornar este horário disponível</button>
          <p class="agenda-admin-ajuda">Esses dados aparecem como dica de tela no painel secreto. No HTML publicado, os dados ficam dentro do código-fonte.</p>
        `;

        editor.querySelectorAll("[data-admin-campo]").forEach((campo) => {
          campo.addEventListener("input", atualizarRegistroPeloEditor);
          campo.addEventListener("change", atualizarRegistroPeloEditor);
        });

        editor.querySelector("[data-admin-remover-horario]").addEventListener("click", () => {
          removerRegistroIndisponibilidade(adminDataSelecionada, adminHorarioSelecionado);
          adminHorarioSelecionado = "";
          limparCodigoAdminGerado();
          renderizarPainelAdmin();
          renderizarCalendario();
        });
      }

      function atualizarRegistroPeloEditor(evento) {
        const campo = evento.target;
        const nomeCampo = campo.dataset.adminCampo;
        const registroAtual = obterRegistroIndisponibilidade(adminDataSelecionada, adminHorarioSelecionado) || criarRegistroPadrao();

        if (nomeCampo === "tipo") {
          let novoRegistro = criarRegistroPadrao();

          if (campo.value === "estudante") {
            novoRegistro = { tipo: "estudante", nome: "", telefone: "", assunto: "", modalidade: "online", localPresencial: "", endereco: "" };
          } else if (campo.value === "senar") {
            novoRegistro = { tipo: "senar", local: "", assunto: "" };
          }

          definirRegistroIndisponibilidade(adminDataSelecionada, adminHorarioSelecionado, novoRegistro);
          limparCodigoAdminGerado();
          renderizarPainelAdmin();
          renderizarCalendario();
          return;
        }

        registroAtual[nomeCampo] = campo.value;
        definirRegistroIndisponibilidade(adminDataSelecionada, adminHorarioSelecionado, registroAtual);
        limparCodigoAdminGerado();
        renderizarPainelAdmin();
        renderizarCalendario();
      }

      function montarObjetoIndisponibilidadesParaCodigo() {
        const objeto = {};
        const ordem = gerarHorarios();

        Object.keys(indisponibilidadesEditaveis).sort().forEach((dataIso) => {
          const registros = indisponibilidadesEditaveis[dataIso] || {};
          const registrosOrdenados = {};

          ordem.forEach((horario) => {
            if (registros[horario]) {
              registrosOrdenados[horario] = limparRegistro(registros[horario]);
            }
          });

          if (Object.keys(registrosOrdenados).length > 0) {
            objeto[dataIso] = registrosOrdenados;
          }
        });

        return objeto;
      }

      function gerarBlocoIndisponibilidades() {
        const objeto = montarObjetoIndisponibilidadesParaCodigo();
        const json = JSON.stringify(objeto, null, 2).split("\n").map((linha, indice) => indice === 0 ? linha : `      ${linha}`).join("\n");

        return [
          "      // =========================================================",
          "      // INÍCIO DAS INDISPONIBILIDADES MANUAIS",
          "      // Substitua todo este bloco pelo código gerado no painel secreto.",
          `      const HORARIOS_INDISPONIVEIS = ${json};`,
          "      let indisponibilidadesEditaveis = {};",
          "      // FIM DAS INDISPONIBILIDADES MANUAIS"
        ].join("\n");
      }

      function gerarCodigoAdmin() {
        const wrap = adminModal.querySelector("[data-admin-codigo-wrap]");
        const textarea = adminModal.querySelector("[data-admin-codigo]");
        const feedback = adminModal.querySelector("[data-admin-feedback]");
        textarea.value = gerarBlocoIndisponibilidades();
        wrap.hidden = false;
        feedback.textContent = "Código gerado. Copie e substitua o bloco marcado no arquivo agendar.html.";
      }

      async function copiarCodigoAdmin() {
        const textarea = adminModal.querySelector("[data-admin-codigo]");
        const feedback = adminModal.querySelector("[data-admin-feedback]");
        if (!textarea.value.trim()) gerarCodigoAdmin();

        try {
          await navigator.clipboard.writeText(textarea.value);
          feedback.textContent = "Código copiado para a área de transferência.";
        } catch (erro) {
          textarea.focus();
          textarea.select();
          document.execCommand("copy");
          feedback.textContent = "Código selecionado/copiado. Se necessário, use Ctrl+C.";
        }
      }

      function limparCodigoAdminGerado() {
        if (!adminModal) return;
        const wrap = adminModal.querySelector("[data-admin-codigo-wrap]");
        const textarea = adminModal.querySelector("[data-admin-codigo]");
        const feedback = adminModal.querySelector("[data-admin-feedback]");
        if (wrap) wrap.hidden = true;
        if (textarea) textarea.value = "";
        if (feedback) feedback.textContent = "";
      }

      btnAnterior.addEventListener("click", () => {
        if (btnAnterior.disabled) return;
        mesAtual--;
        if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
        renderizarCalendario();
      });

      btnProximo.addEventListener("click", () => {
        mesAtual++;
        if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
        renderizarCalendario();
      });

      btnVoltar.addEventListener("click", () => {
        if (estado.etapa === 0) return;
        estado.etapa--;
        renderizarPopup();
      });

      btnAvancar.addEventListener("click", () => {
        if (!podeAvancar() || estado.etapa === 2) return;
        estado.etapa++;
        renderizarPopup();
      });

      btnConfirmar.addEventListener("click", enviarWhatsApp);
      modalFechar.forEach((botao) => botao.addEventListener("click", fecharModal));

      document.addEventListener("keydown", (evento) => {
        const atalhoPainelAdmin = evento.ctrlKey && evento.shiftKey && (evento.code === "NumpadAdd" || (evento.key === "+" && evento.location === 3));
        if (atalhoPainelAdmin) {
          evento.preventDefault();
          abrirPainelAdmin();
          return;
        }

        if (evento.key === "Escape") {
          if (adminModal && !adminModal.hidden) {
            fecharPainelAdmin();
            return;
          }
          if (!modal.hidden) fecharModal();
        }
      });

      criarPainelAdmin();
      renderizarCalendario();
    })();
  </script>
</body>
</html>
