name: Verificar checklist SEO dos artigos
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'scripts/seo-score.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cafematica-editorial-writes
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Recalcular o checklist editorial para cada artigo
        run: node scripts/seo-score.mjs --write
      - name: Gravar somente notas que realmente mudaram
        run: |
          git add -u -- content/posts
          if git diff --cached --quiet; then
            echo "As notas SEO já estão atualizadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(seo): atualizar checklist editorial automático"
          git pull --rebase origin main
          git push origin HEAD:main
