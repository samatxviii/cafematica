name: Portal Cafemática
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cafematica-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npm run admin:build
      - uses: actions/upload-artifact@v4
        with:
          name: painel-administrativo
          path: admin-dist
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Aguardar a publicação anterior da branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub permits artifact deployment from the configured source branch.
          # When branch publishing is still enabled, wait for its automatic job
          # so it cannot overwrite this artifact with the legacy root files.
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" != "legacy" ] || [ "${{ github.event_name }}" != "push" ]; then
            exit 0
          fi
          for attempt in $(seq 1 60); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "not_started"')
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "A publicação automática da branch ainda não terminou. Execute novamente após sua conclusão."
          exit 1
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Ajustar origem do GitHub Pages para Actions
        # O projeto usa Astro. A origem antiga por branch dispara Jekyll sobre
        # arquivos .astro e gera uma falha paralela desnecessária a cada push.
        # Esta atualização é idempotente e ocorre somente após deploy bem-sucedido.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" = "legacy" ]; then
            echo "Migrando origem do Pages de Jekyll (branch) para GitHub Actions..."
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          else
            echo "GitHub Pages já usa o fluxo de publicação: $mode"
          fi
