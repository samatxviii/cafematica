# Cafemática — edição direta dos artigos em GitHub, sem Supabase nem servidor.
# Acesse https://app.pagescms.org e conecte este repositório.
media:
  input: public/imagens/blog
  output: /imagens/blog
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Publica novo artigo: {filename}"
      update: "Atualiza artigo: {filename}"

content:
  - name: posts
    label: Artigos do Cafemática
    type: collection
    path: content/posts
    subfolders: true
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      primary: title
      fields: [title, category, publicationStatus, publishAt, date]
      layout: tree
      sort: [date, title]
      default:
        sort: date
        order: desc
    operations:
      rename: false
      delete: false
    actions:
      - name: move-post-folder
        label: Mover artigo para pasta
        scope: entry
        workflow: pages-cms-move-post.yml
        ref: current
        cancelable: false
        confirm:
          title: Mover este artigo?
          message: O arquivo será movido no GitHub, mas o endereço público do artigo não mudará.
          button: Mover artigo
        fields:
          - name: folder
            label: Pasta de destino
            type: select
            required: true
            options:
              - label: Sem pasta (raiz de Artigos)
                value: raiz
              - label: Matemática
                value: matematica
              - label: LaTeX
                value: latex
              - label: Tecnologia
                value: tecnologia
    fields:
      - name: title
        label: Título
        type: string
        required: true
        options:
          minlength: 5
          maxlength: 160
      - name: slug
        label: Endereço do artigo (não alterar em artigos existentes)
        type: string
        required: true
        description: "Somente letras minúsculas, números e hífens. Exemplo: juros-compostos-na-pratica. Não altere o endereço de artigos já publicados."
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        options:
          minlength: 3
          maxlength: 90
      - name: description
        label: Resumo do artigo
        type: text
        required: true
        options:
          minlength: 30
          maxlength: 300
      - name: seoTitle
        label: SEO — título para buscadores (opcional)
        type: string
        description: "Título sugerido para a aba, o Google e prévias sociais. Deixe vazio para gerar automaticamente a partir do título do artigo. O Google pode escolher outro texto."
        options:
          maxlength: 75
      - name: seoDescription
        label: SEO — descrição para buscadores (opcional)
        type: text
        description: "Explique o que o leitor aprenderá. Se ficar vazio, o site usa o resumo automaticamente. O Google pode gerar outro trecho conforme a pesquisa."
        options:
          maxlength: 180
      - name: tags
        label: Tags / assuntos relacionados
        type: string
        list:
          max: 8
        description: "Use de 3 a 6 assuntos específicos, um por linha, sem repetições. Alimentam a navegação, a busca interna e os dados do artigo, não a antiga meta tag keywords (ignorada pelo Google)."
      - name: category
        label: Categoria
        type: select
        required: true
        default: matematica
        options:
          values:
            - name: matematica
              label: Matemática
            - name: latex
              label: LaTeX
            - name: tecnologia
              label: Tecnologia
      - name: topic
        label: Assunto específico
        type: string
        description: "Assunto principal mais específico que a categoria. Ex.: Álgebra, Educação financeira, Funções, Documentos acadêmicos. Ajuda o leitor a filtrar os artigos."
      - name: cover
        label: Imagem de capa
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, avif]
          rename: safe
      - name: coverAlt
        label: Descrição da imagem de capa (acessibilidade)
        type: string
        description: "O que a imagem realmente mostra? Não encha de palavras-chave."
        options:
          maxlength: 180
      - name: author
        label: Autor do artigo
        type: string
        default: "Fernando da Silva Batista"
        description: "Nome real do responsável pelo conteúdo. Será mostrado ao leitor e informado nos dados estruturados."
        options:
          maxlength: 120
      - name: date
        label: Data de publicação
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Última revisão significativa (opcional)
        type: date
        default: ""
        description: "Preencha somente quando o conteúdo for realmente atualizado. Não troque a data apenas para parecer recente."
        options:
          format: yyyy-MM-dd
      - name: publicationStatus
        label: Modo de publicação
        type: select
        required: true
        default: draft
        description: "Rascunho não aparece no site. Publicar imediatamente libera após o deploy. Agendar oculta um artigo já publicado até o horário escolhido."
        options:
          values:
            - name: draft
              label: Rascunho — não publicar
            - name: published
              label: Publicar imediatamente
            - name: scheduled
              label: Agendar publicação
      - name: publishAt
        label: Data e horário programados (UTC−4)
        type: date
        default: ""
        description: "Use este campo ao selecionar Agendar publicação. Informe a data e hora de Mato Grosso do Sul (UTC−4 fixo), sem conversão automática. O artigo fica fora do site até esse horário; a conferência acontece a cada cinco minutos e a implantação pode demorar."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: youtube
        label: ID do vídeo YouTube (opcional)
        type: string
        description: "Apenas os 11 caracteres do identificador do vídeo."
      - name: quickAnswer
        label: Resposta curta ou principal aprendizado (opcional)
        type: text
        description: "Resposta direta e original à principal dúvida do leitor (2 a 4 frases). Aparece no artigo, não é conteúdo escondido para robôs."
        options:
          maxlength: 600
      - name: faq
        label: Perguntas e respostas do artigo (opcional)
        type: object
        description: "Somente perguntas realmente respondidas neste artigo, com respostas originais e úteis. O site as mostra ao leitor; não prometemos destaque especial no Google."
        list:
          max: 5
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: Pergunta
            type: string
            required: true
            options:
              minlength: 8
              maxlength: 180
          - name: answer
            label: Resposta
            type: text
            required: true
            options:
              minlength: 20
              maxlength: 900
      - name: sources
        label: Fontes e leituras recomendadas (opcional)
        type: object
        list:
          max: 12
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Nome da fonte
            type: string
            required: true
          - name: url
            label: Link da fonte (https)
            type: string
            required: true
            pattern: "^https://.+"
      - name: body
        label: Conteúdo
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
