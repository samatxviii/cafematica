# Cafemática — edição direta dos artigos em GitHub, sem Supabase nem servidor.
# Acesse https://app.pagescms.org e conecte este repositório.
media:
  input: public/imagens/blog
  output: /imagens/blog
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Publica novo artigo: {filename}"
      update: "Atualiza artigo: {filename}"

content:
  - name: posts
    label: Artigos do Cafemática
    type: collection
    path: content/posts
    subfolders: true
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      primary: title
      fields: [title, seoScore, category, published, date]
      layout: tree
      sort: [date, title]
      default:
        sort: date
        order: desc
    operations:
      rename: false
      delete: false
    actions:
      - name: move-post-folder
        label: Mover artigo para pasta
        scope: entry
        workflow: pages-cms-move-post.yml
        ref: current
        cancelable: false
        confirm:
          title: Mover este artigo?
          message: O arquivo será movido no GitHub, mas o endereço público do artigo não mudará.
          button: Mover artigo
        fields:
          - name: folder
            label: Pasta de destino
            type: select
            required: true
            options:
              - label: Sem pasta (raiz de Artigos)
                value: raiz
              - label: Matemática
                value: matematica
              - label: LaTeX
                value: latex
              - label: Tecnologia
                value: tecnologia
    fields:
      - name: seoScore
        label: Checklist SEO (0-10)
        type: number
        readonly: true
        description: "Pontuação automática de 10 verificações editoriais objetivas. Não representa ranking nem nota do Google. É atualizada pelo GitHub após salvar."
        options:
          min: 0
          max: 10
      - name: title
        label: Título
        type: string
        required: true
        options:
          minlength: 5
          maxlength: 160
      - name: slug
        label: Endereço do artigo (não alterar em artigos existentes)
        type: string
        required: true
        description: "Somente letras minúsculas, números e hífens. Exemplo: juros-compostos-na-pratica. Não altere o endereço de artigos já publicados."
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        options:
          minlength: 3
          maxlength: 90
      - name: description
        label: Resumo do artigo
        type: text
        required: true
        options:
          minlength: 30
          maxlength: 300
      - name: seoTitle
        label: Título para Google e compartilhamentos (opcional)
        type: string
        description: "Use um título claro e específico. Se ficar vazio, utilizaremos o título normal do artigo. Evite repetir palavras."
        options:
          maxlength: 75
      - name: seoDescription
        label: Descrição para mecanismos de busca (opcional)
        type: text
        description: "Explique o benefício real de ler o artigo. Se ficar vazio, usaremos o resumo. Não existe garantia de que o Google exibirá este texto."
        options:
          maxlength: 180
      - name: tags
        label: Tags / assuntos relacionados
        type: string
        list:
          max: 8
        description: "Adicione entre 3 e 6 termos pertinentes, um por linha. Ajudam na navegação e na busca interna; não são a antiga meta tag keywords."
      - name: category
        label: Categoria
        type: select
        required: true
        default: matematica
        options:
          values:
            - name: matematica
              label: Matemática
            - name: latex
              label: LaTeX
            - name: tecnologia
              label: Tecnologia
      - name: topic
        label: Assunto específico
        type: string
        description: "Exemplo: Educação financeira, Álgebra ou Tutoriais."
      - name: cover
        label: Imagem de capa
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, avif]
          rename: safe
      - name: coverAlt
        label: Descrição da imagem de capa (acessibilidade)
        type: string
        description: "O que a imagem realmente mostra? Não encha de palavras-chave."
        options:
          maxlength: 180
      - name: author
        label: Autor do artigo
        type: string
        default: "Fernando da Silva Batista"
        description: "Nome real do responsável pelo conteúdo. Será mostrado ao leitor e informado nos dados estruturados."
        options:
          maxlength: 120
      - name: date
        label: Data de publicação
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Última revisão significativa (opcional)
        type: date
        default: ""
        description: "Preencha somente quando o conteúdo for realmente atualizado. Não troque a data apenas para parecer recente."
        options:
          format: yyyy-MM-dd
      - name: published
        label: Publicado no site
        type: boolean
        default: true
        description: "Ativado = o artigo aparece no site após o GitHub Actions concluir a publicação."
      - name: youtube
        label: ID do vídeo YouTube (opcional)
        type: string
        description: "Apenas os 11 caracteres do identificador do vídeo."
      - name: quickAnswer
        label: Resposta curta ou principal aprendizado (opcional)
        type: text
        description: "Responda à dúvida central em 2 a 4 frases, com informações corretas e úteis. Aparecerá visivelmente no artigo."
        options:
          maxlength: 600
      - name: sources
        label: Fontes e leituras recomendadas (opcional)
        type: object
        list:
          max: 12
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Nome da fonte
            type: string
            required: true
          - name: url
            label: Link da fonte (https)
            type: string
            required: true
            pattern: "^https://.+"
      - name: body
        label: Conteúdo
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
